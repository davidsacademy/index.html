                <a href="mailto:info@davidsacademy.ca" style={{color:"#15803d",fontSize:11,fontWeight:700,textDecoration:"none"}}>✉️ info@davidsacademy.ca</a>
              </div>
            </div>
          </div>
        </div>

        {/* Practice All Button */}
        <button onClick={startAll} style={{width:"100%",marginBottom:8,background:"linear-gradient(135deg,#1e293b,#334155)",border:"none",borderRadius:12,padding:"9px 14px",cursor:"pointer",textAlign:"right",display:"flex",alignItems:"center",justifyContent:"space-between",gap:8,boxShadow:"0 4px 16px rgba(0,0,0,0.18)",direction:"rtl"}}>
          <div>
            <div style={{fontWeight:800,fontSize:15,color:"#fff",...urduFont}}>🗂️ مشق ٹیسٹ (تمام)</div>
            <div style={{fontSize:11,color:"#94a3b8",marginTop:2,...urduFont}}>بے ترتیب 40 سوالات — نشانات + قوانین</div>
          </div>
          <span style={{background:"#f59e0b",color:"#fff",borderRadius:100,padding:"8px 16px",fontSize:16,fontWeight:900,whiteSpace:"nowrap",flexShrink:0}}>40 سوال</span>
        </button>

        {/* Signs section */}
        <p style={{fontSize:13,letterSpacing:0,color:"#d97706",textTransform:"uppercase",fontWeight:800,marginBottom:3,...urduFont}}>🚦 ٹریفک نشانات ({ALL_SIGNS.length} سوالات)</p>
        <div style={{display:"grid",gridTemplateColumns:"1fr 1fr 1fr",gap:6,marginBottom:8}}>
          {SETS.filter(s=>s.cat==="نشانات").map(set=>(
            <button key={set.key} onClick={()=>startSet(set)} style={{background:"#f59e0b",border:"2px solid #d97706",borderRadius:10,padding:"10px 8px",cursor:"pointer",textAlign:"right",direction:"rtl",minHeight:64,display:"flex",alignItems:"center",justifyContent:"flex-end"}}>
              <div style={{fontWeight:800,fontSize:14,color:"#000",...urduFont,lineHeight:1.4,display:"flex",flexDirection:"column",alignItems:"flex-end",gap:2}}><span>{set.label}</span><span style={{fontSize:11,fontWeight:700,fontFamily:"sans-serif",direction:"ltr",color:"#0c4a6e"}}>{set.range}</span></div>
              
            </button>
          ))}
        </div>

        {/* Rules section */}
        <p style={{fontSize:13,letterSpacing:0,color:"#0284c7",textTransform:"uppercase",fontWeight:800,marginBottom:3,...urduFont}}>📋 ڈرائیونگ قوانین ({ALL_RULES.length} سوالات)</p>
        <div style={{display:"grid",gridTemplateColumns:"1fr 1fr 1fr",gap:6,marginBottom:8}}>
          {SETS.filter(s=>s.cat==="قوانین").map(set=>(
            <button key={set.key} onClick={()=>startSet(set)} style={{background:"#0ea5e9",border:"2px solid #0284c7",borderRadius:10,padding:"10px 8px",cursor:"pointer",textAlign:"right",direction:"rtl",minHeight:64,display:"flex",alignItems:"center",justifyContent:"flex-end"}}>
              <div style={{fontWeight:800,fontSize:14,color:"#000",...urduFont,lineHeight:1.4,display:"flex",flexDirection:"column",alignItems:"flex-end",gap:2}}><span>{set.label}</span><span style={{fontSize:11,fontWeight:700,fontFamily:"sans-serif",direction:"ltr",color:"#0c4a6e"}}>{set.range}</span></div>
              
            </button>
          ))}
        </div>

        <div style={{background:"#fffbeb",border:"1.5px solid #fde68a",borderRadius:10,padding:"6px 10px",marginBottom:6,direction:"rtl"}}>
          <p style={{margin:0,color:"#78350f",fontSize:13,lineHeight:2,...urduFont}}>💡 <strong>اصل G1 ٹیسٹ:</strong> 40 سوالات — 20 نشانات + 20 قوانین۔ ہر حصے میں زیادہ سے زیادہ 4 غلطیاں۔ پاس = <strong>80%</strong>۔</p>
        </div>
        <div style={{textAlign:"center"}}>
          <button onClick={()=>{try{window.parent.document.getElementById("urdupop").style.display="none";}catch(e){window.top.location.href="https://davidsacademy.ca";}}} style={{display:"inline-flex",alignItems:"center",gap:8,background:"#CC0000",color:"#fff",fontSize:14,border:"none",fontWeight:800,padding:"10px 24px",borderRadius:10,boxShadow:"0 4px 16px rgba(204,0,0,0.3)",cursor:"pointer",...urduFont}}>🏠 ہوم</button>
        </div>
      </div>
    </div>
  );

  if(screen==="quiz"&&qs.length>0){
    const q=qs[cur];
    const sv=q.sv&&S[q.sv];
    return(
      <div style={P}>
        <div style={{maxWidth:680,margin:"0 auto",padding:"12px 14px"}}>
          <div style={{display:"flex",justifyContent:"space-between",alignItems:"center",marginBottom:14,direction:"rtl"}}>
            <div style={{display:"flex",gap:8,alignItems:"center",flexShrink:0}}>
              <span style={{fontSize:12,color:"#334155",fontWeight:700,...urduFont}}>{cur+1}/{qs.length}</span>
              <div style={{background:"#dcfce7",border:"1.5px solid #86efac",borderRadius:10,padding:"4px 10px",fontSize:13,fontWeight:800,color:"#16a34a",fontFamily:"monospace"}}>⏱{fmt(time)}</div>
            </div>
            <div style={{fontSize:11,color:"#64748b",fontWeight:700,textAlign:"center",flex:1,margin:"0 8px",overflow:"hidden",textOverflow:"ellipsis",whiteSpace:"nowrap",...urduFont}}>{setLabel}</div>
            <button onClick={()=>{setTOn(false);setScreen("home");}} style={{background:"#fff",border:"1.5px solid #cbd5e1",color:"#1e293b",borderRadius:10,padding:"6px 12px",cursor:"pointer",fontSize:13,fontWeight:700,...urduFont}}>چھوڑیں ←</button>
          </div>
          <div style={{background:"#e2e8f0",borderRadius:6,height:5,marginBottom:16}}>
            <div style={{height:"100%",borderRadius:6,background:"linear-gradient(90deg,#f59e0b,#f97316)",width:`${((cur+1)/qs.length)*100}%`,transition:"width 0.4s ease"}}/>
          </div>
          <span style={{background:CB[q.cat]||"#f1f5f9",color:CC[q.cat]||"#334155",border:`1.5px solid ${(CC[q.cat]||"#94a3b8")+"55"}`,borderRadius:100,padding:"4px 12px",fontSize:11,fontWeight:700,...urduFont}}>{CI[q.cat]||"📚"} {q.cat}</span>
          <div style={{background:"#fff",border:"1.5px solid #e2e8f0",borderRadius:12,padding:"9px 12px",marginTop:6,marginBottom:8,boxShadow:"0 2px 6px rgba(0,0,0,0.06)",direction:"rtl"}}>
            <p style={{fontSize:17,fontWeight:800,margin:0,lineHeight:2.2,color:"#000",...urduFont}}>{q.q}</p>
          </div>
          <div style={{display:"flex",gap:8,alignItems:"flex-start",direction:"rtl"}}>
            {sv&&(
              <div style={{background:"linear-gradient(145deg,#1a2535,#2d3f55)",borderRadius:12,padding:"7px",display:"flex",flexDirection:"column",alignItems:"center",justifyContent:"center",boxShadow:"0 3px 10px rgba(0,0,0,0.22)",width:80,minWidth:80,flexShrink:0}}>
                <div style={{background:"#2a2a2a",borderRadius:6,padding:"3px"}}>{sv(62)}</div>
              </div>
            )}
            <div style={{flex:1,display:"flex",flexDirection:"column",gap:5}}>
              {q.opts.map((opt,i)=>{
                let bg="#fff",border="1.5px solid #cbd5e1",color="#0f172a",bBg="#e2e8f0",bC="#1e293b";
                if(sel!==null){
                  if(i===q.ans){bg="#f0fdf4";border="2px solid #22c55e";color="#14532d";bBg="#22c55e";bC="#fff";}
                  else if(i===sel&&i!==q.ans){bg="#fff1f2";border="2px solid #f43f5e";color="#881337";bBg="#f43f5e";bC="#fff";}
                }
                const letters=["A","B","C","D"];
                return(
                  <button key={i} onClick={()=>pick(i)} disabled={sel!==null} style={{background:bg,border,color,borderRadius:9,padding:"10px 12px",cursor:sel!==null?"default":"pointer",textAlign:"right",fontSize:16,fontFamily:"'Noto Nastaliq Urdu',sans-serif",fontWeight:700,direction:"rtl",transition:"all 0.18s",display:"flex",gap:10,alignItems:"center",width:"100%",lineHeight:2}}>
                    <div style={{flex:1,...urduFont,color:sel!==null?color:"#000"}}>{opt}</div>
                    <span style={{width:30,height:30,minWidth:30,borderRadius:"50%",background:bBg,color:bC,display:"flex",alignItems:"center",justifyContent:"center",fontSize:13,fontWeight:900,flexShrink:0,fontFamily:"sans-serif"}}>
                      {sel!==null&&i===q.ans?"✓":sel!==null&&i===sel&&i!==q.ans?"✗":letters[i]}
                    </span>
                  </button>
                );
              })}
            </div>
          </div>
          {sel!==null&&(
            <div style={{background:sel===q.ans?"#f0fdf4":"#fff1f2",border:`1.5px solid ${sel===q.ans?"#86efac":"#fda4af"}`,borderRadius:9,marginTop:6,padding:"8px 12px",direction:"rtl"}}>
              <p style={{margin:0,fontSize:15,lineHeight:2.2,color:sel===q.ans?"#14532d":"#7f1d1d",...urduFont}}>
                {sel===q.ans?"✅ درست! ":"❌ غلط۔ "}
                <span style={{color:"#111827",fontWeight:600}}>{q.exp}</span>
              </p>
            </div>
          )}
          <button onClick={next} disabled={sel===null} style={{marginTop:12,width:"100%",background:sel===null?"#e2e8f0":"linear-gradient(135deg,#f59e0b,#f97316)",border:"none",borderRadius:11,padding:"16px",fontSize:17,fontWeight:800,color:sel===null?"#94a3b8":"#fff",cursor:sel===null?"default":"pointer",boxShadow:sel===null?"none":"0 4px 16px rgba(245,158,11,0.35)",transition:"all 0.2s",...urduFont}}>
            {cur+1>=qs.length?"نتائج دیکھیں ←":"اگلا سوال ←"}
          </button>
        </div>
      </div>
    );
  }

  if(screen==="results") return(
    <div style={P}>
      <div style={{maxWidth:680,margin:"0 auto",padding:"20px 14px 28px"}}>
        <div style={{textAlign:"center",marginBottom:24}}>
          <div style={{fontSize:52,marginBottom:6}}>{passed?"🏆":"📚"}</div>
          <h2 style={{fontSize:"clamp(1.4rem,4vw,2rem)",fontWeight:900,margin:"0 0 4px",color:passed?"#d97706":"#dc2626",...urduFont}}>{passed?"آپ پاس ہو گئے!":"مزید مشق کریں"}</h2>
          <p style={{color:"#334155",fontSize:13,margin:0,...urduFont}}>{passed?"شاندار — آپ اصل G1 ٹیسٹ کے لیے تیار ہیں!":"وضاحتیں پڑھیں اور دوبارہ کوشش کریں۔"}</p>
        </div>
        <div style={{background:"#fff",border:`2.5px solid ${passed?"#22c55e":"#f43f5e"}`,borderRadius:20,padding:"20px 16px",marginBottom:20,textAlign:"center"}}>
          <div style={{marginBottom:10}}>
            <span style={{fontSize:"clamp(2.8rem,9vw,4.5rem)",fontWeight:900,color:passed?"#16a34a":"#dc2626",lineHeight:1}}>{score}</span>
            <span style={{fontSize:"clamp(1.4rem,5vw,2.3rem)",fontWeight:700,color:"#475569"}}>/{qs.length}</span>
          </div>
          <span style={{background:passed?"#dcfce7":"#fee2e2",color:passed?"#15803d":"#dc2626",border:`2px solid ${passed?"#86efac":"#fca5a5"}`,borderRadius:100,padding:"6px 24px",fontSize:22,fontWeight:900}}>{pct}%</span>
          <div style={{background:"#f1f5f9",borderRadius:8,height:9,margin:"14px auto 0",maxWidth:360}}>
            <div style={{height:"100%",borderRadius:8,background:passed?"linear-gradient(90deg,#22c55e,#16a34a)":"linear-gradient(90deg,#f43f5e,#dc2626)",width:`${pct}%`,transition:"width 0.6s ease"}}/>
          </div>
          <div style={{display:"flex",justifyContent:"center",gap:14,marginTop:14,flexWrap:"wrap"}}>
            {[{l:"درست",v:score,c:"#16a34a",bg:"#dcfce7",i:"✅"},{l:"غلط",v:qs.length-score,c:"#dc2626",bg:"#fee2e2",i:"❌"},{l:"پاس نشان",v:"80%",c:"#d97706",bg:"#fef3c7",i:"🎯"}].map(s=>(
              <div key={s.l} style={{background:s.bg,borderRadius:10,padding:"9px 16px",minWidth:70,textAlign:"center"}}>
                <div style={{fontSize:18}}>{s.i}</div>
                <div style={{fontSize:18,fontWeight:900,color:s.c}}>{s.v}</div>
                <div style={{fontSize:10,color:"#475569",fontWeight:700,...urduFont}}>{s.l}</div>
              </div>
            ))}
          </div>
        </div>
        <p style={{fontSize:10,color:"#475569",fontWeight:800,marginBottom:10,...urduFont}}>سوالات کا جائزہ</p>
        <div style={{display:"flex",flexDirection:"column",gap:8,marginBottom:24}}>
          {answers.map((a,i)=>{
            const ok=a.sel===a.q.ans;
            const sv=a.q.sv&&S[a.q.sv];
            return(
              <div key={i} style={{background:"#fff",border:`2px solid ${ok?"#22c55e":"#f43f5e"}`,borderRadius:11,padding:"10px 12px",borderRight:`5px solid ${ok?"#22c55e":"#f43f5e"}`,direction:"rtl"}}>
                <div style={{display:"flex",justifyContent:"space-between",marginBottom:4}}>
                  <span style={{fontSize:10,color:CC[a.q.cat]||"#334155",fontWeight:700,...urduFont}}>{CI[a.q.cat]||"📚"} {a.q.cat}</span>
                  <span style={{fontSize:14}}>{ok?"✅":"❌"}</span>
                </div>
                <div style={{display:"flex",gap:9,alignItems:"center",direction:"rtl"}}>
                  {sv&&<div style={{background:"#1e293b",borderRadius:7,padding:"3px",flexShrink:0,width:44,height:44,display:"flex",alignItems:"center",justifyContent:"center",overflow:"hidden"}}>{sv(38)}</div>}
                  <div style={{flex:1,minWidth:0}}>
                    <p style={{margin:"0 0 3px",fontSize:13,color:"#1e293b",fontWeight:600,lineHeight:1.8,...urduFont}}>{a.q.q}</p>
                    {!ok&&<p style={{margin:0,fontSize:12,wordBreak:"break-word",lineHeight:1.8,...urduFont}}><span style={{color:"#16a34a",fontWeight:700}}>✓ {a.q.opts[a.q.ans]}</span>{a.sel!==null&&<span style={{color:"#dc2626"}}> — آپ کا جواب: {a.q.opts[a.sel]}</span>}</p>}
                  </div>
                </div>
              </div>
            );
          })}
        </div>
        <div style={{display:"flex",gap:10,marginBottom:16}}>
          <button onClick={()=>{try{window.parent.document.getElementById("urdupop").style.display="none";}catch(e){window.top.location.href="https://davidsacademy.ca";}}} style={{flex:1,display:"flex",alignItems:"center",justifyContent:"center",gap:6,background:"#CC0000",color:"#fff",fontSize:13,border:"none",fontWeight:800,padding:"13px",borderRadius:11,cursor:"pointer",...urduFont}}>🏠 ہوم</button>
          <button onClick={()=>startAll()} style={{flex:2,background:"linear-gradient(135deg,#f59e0b,#f97316)",border:"none",borderRadius:11,padding:"13px",fontSize:13,fontWeight:800,color:"#fff",cursor:"pointer",...urduFont}}>دوبارہ کوشش کریں 🔄</button>
        </div>
      </div>
    </div>
  );

  return null;
}

const root=ReactDOM.createRoot(document.getElementById('root'));
root.render(<App/>);
</script>
</body>
</html>
