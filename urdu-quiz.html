function App(){
  const [screen,setScreen]=useState("home");
  const [cur,setCur]=useState(0);
  const [sel,setSel]=useState(null);
  const [answers,setAnswers]=useState([]);
  const [qs,setQs]=useState([]);
  const [time,setTime]=useState(null);
  const [tOn,setTOn]=useState(false);
  const [setLabel,setSetLabel]=useState("");

  const startSet=(setObj)=>{
    const pool=[...setObj.pool].sort(()=>Math.random()-0.5);
    setQs(pool);setAnswers([]);setCur(0);setSel(null);
    setTime(pool.length*35);setTOn(true);setSetLabel(setObj.label);
    setScreen("quiz");
  };
  const startAll=()=>{
    const pool=[...ALL_SIGNS,...ALL_RULES].sort(()=>Math.random()-0.5).slice(0,40);
    setQs(pool);setAnswers([]);setCur(0);setSel(null);
    setTime(40*35);setTOn(true);setSetLabel("Practice Test — All 40 Questions");
    setScreen("quiz");
  };

  useEffect(()=>{
    if(!tOn||time===null)return;
    if(time<=0){fin();return;}
    const t=setTimeout(()=>setTime(v=>v-1),1000);
    return()=>clearTimeout(t);
  },[tOn,time]);

  const pick=(i)=>{if(sel!==null)return;setSel(i);};
  const next=()=>{
    const na=[...answers,{q:qs[cur],sel}];
    if(cur+1>=qs.length){setAnswers(na);fin(na);}
    else{setAnswers(na);setCur(c=>c+1);setSel(null);}
  };
  const fin=(f)=>{setTOn(false);setAnswers(f||answers);setScreen("results");};
  const fmt=(s)=>`${Math.floor(s/60)}:${String(s%60).padStart(2,"0")}`;
  const score=answers.filter(a=>a.sel===a.q.ans).length;
  const pct=qs.length>0?Math.round((score/qs.length)*100):0;
  const passed=pct>=80;
  const P={minHeight:"100vh",background:"linear-gradient(160deg,#f0f9ff 0%,#e0f2fe 40%,#f0fdf4 100%)",fontFamily:"'Segoe UI',system-ui,sans-serif",color:"#1e293b",padding:0};

  if(screen==="home") return(
    <div style={P}>

        </div>

        <div style={{fontSize:9,letterSpacing:2,color:"#059669",textTransform:"uppercase",fontWeight:800,marginBottom:3}}>📋 ڈرائیونگ قواعد ({ALL_RULES.length} questions)</div>
        <div style={{display:"grid",gridTemplateColumns:"1fr 1fr 1fr",gap:6,marginBottom:8}}>
          {SETS.filter(s=>s.cat==="قواعد").map(set=>(
            <button key={set.key} onClick={()=>startSet(set)} style={{background:"#059669",border:"2px solid #047857",borderRadius:10,padding:"8px 8px",cursor:"pointer",textAlign:"left",transition:"all 0.18s",boxShadow:"0 2px 8px rgba(0,0,0,0.05)"}}
              onMouseEnter={e=>{e.currentTarget.style.transform="translateY(-2px)";e.currentTarget.style.boxShadow="0 8px 20px rgba(5,150,105,0.4)";}}
              onMouseLeave={e=>{e.currentTarget.style.transform="translateY(0)";e.currentTarget.style.boxShadow="0 2px 8px rgba(0,0,0,0.05)";}}>
              <div style={{fontWeight:800,fontSize:11,color:"#fff"}}>{set.label}</div>
              <div style={{fontSize:9,color:"#6ee7b7",marginTop:1,fontWeight:700}}>{set.count} Qs</div>
            </button>
          ))}
        </div>

        <div style={{background:"#fffbeb",border:"1.5px solid #fde68a",borderRadius:10,padding:"6px 10px",marginBottom:6}}>
          <p style={{margin:0,color:"#78350f",fontSize:10,lineHeight:1.5}}>💡 <strong>Real G1 Test:</strong> 40 questions — 20 signs + 20 rules. Max 4 wrong per section. Pass = <strong>80%</strong>.</p>
        </div>
        <div style={{textAlign:"center"}}>
          <button onClick={()=>{try{window.parent.document.getElementById("urdupop").style.display="none";}catch(e){window.top.location.href="https://davidsacademy.ca";}}} style={{display:"inline-flex",alignItems:"center",gap:8,background:"#CC0000",color:"#fff",fontSize:14,border:"none",fontWeight:800,padding:"10px 24px",borderRadius:10,boxShadow:"0 4px 16px rgba(204,0,0,0.3)",cursor:"pointer",fontFamily:"inherit"}}>🏠 Home</button>
        </div>
      </div>
    </div>
  );

  if(screen==="quiz"&&qs.length>0){
    const q=qs[cur];
    const sv=q.sv&&S[q.sv];
    return(
      <div style={P}>
        <div style={{maxWidth:680,margin:"0 auto",padding:"12px 14px"}}>
          <div style={{display:"flex",justifyContent:"space-between",alignItems:"center",marginBottom:14}}>
            <button onClick={()=>{setTOn(false);setScreen("home");}} style={{background:"#fff",border:"1.5px solid #cbd5e1",color:"#1e293b",borderRadius:10,padding:"6px 12px",cursor:"pointer",fontSize:13,fontWeight:700}}>← Quit</button>
            <div style={{fontSize:11,color:"#64748b",fontWeight:700,textAlign:"center",flex:1,margin:"0 8px",overflow:"hidden",textOverflow:"ellipsis",whiteSpace:"nowrap"}}>{setLabel}</div>
            <div style={{display:"flex",gap:8,alignItems:"center",flexShrink:0}}>
              <span style={{fontSize:12,color:"#334155",fontWeight:700}}>{cur+1}/{qs.length}</span>
              <div style={{background:time<30?"#fee2e2":"#dcfce7",border:`1.5px solid ${time<30?"#fca5a5":"#86efac"}`,borderRadius:10,padding:"4px 10px",fontSize:13,fontWeight:800,color:time<30?"#dc2626":"#16a34a",fontFamily:"monospace"}}>⏱{fmt(time)}</div>
            </div>
          </div>
          <div style={{background:"#e2e8f0",borderRadius:6,height:5,marginBottom:16}}>
            <div style={{height:"100%",borderRadius:6,background:"linear-gradient(90deg,#f59e0b,#f97316)",width:`${((cur+1)/qs.length)*100}%`,transition:"width 0.4s ease"}}/>
          </div>
          <span style={{background:CB[q.cat]||"#f1f5f9",color:CC[q.cat]||"#334155",border:`1.5px solid ${(CC[q.cat]||"#94a3b8")+"55"}`,borderRadius:100,padding:"4px 12px",fontSize:11,fontWeight:700}}>{CI[q.cat]||"📚"} {q.cat}</span>
          <div style={{background:"#fff",border:"1.5px solid #e2e8f0",borderRadius:12,padding:"9px 12px",marginTop:6,marginBottom:8,boxShadow:"0 2px 6px rgba(0,0,0,0.06)"}}>
            <p style={{fontSize:13,fontWeight:700,margin:0,lineHeight:1.4,color:"#0f172a"}}>{q.q}</p>
          </div>
          <div style={{display:"flex",gap:8,alignItems:"flex-start"}}>
            {sv&&(
              <div style={{background:"linear-gradient(145deg,#1a2535,#2d3f55)",borderRadius:12,padding:"7px",display:"flex",flexDirection:"column",alignItems:"center",justifyContent:"center",boxShadow:"0 3px 10px rgba(0,0,0,0.22)",width:80,minWidth:80,flexShrink:0}}>
                <div style={{background:"#2a2a2a",borderRadius:6,padding:"3px"}}>{sv(62)}</div>
                <p style={{margin:"3px 0 0",fontSize:6,color:"#7a8fa6",letterSpacing:0.5,textTransform:"uppercase",fontWeight:600}}>ON Sign</p>
              </div>
            )}
            <div style={{flex:1,display:"flex",flexDirection:"column",gap:5}}>
              {q.opts.map((opt,i)=>{
                let bg="#fff",border="1.5px solid #cbd5e1",color="#0f172a",bBg="#e2e8f0",bC="#1e293b";
                if(sel!==null){
                  if(i===q.ans){bg="#f0fdf4";border="2px solid #22c55e";color="#14532d";bBg="#22c55e";bC="#fff";}
                  else if(i===sel&&i!==q.ans){bg="#fff1f2";border="2px solid #f43f5e";color="#881337";bBg="#f43f5e";bC="#fff";}
                }
                return(
                  <button key={i} onClick={()=>pick(i)} disabled={sel!==null} style={{background:bg,border,color,borderRadius:9,padding:"7px 9px",cursor:sel!==null?"default":"pointer",textAlign:"left",fontSize:12,fontFamily:"inherit",fontWeight:600,transition:"all 0.18s",display:"flex",gap:7,alignItems:"center",boxShadow:"0 1px 3px rgba(0,0,0,0.05)",width:"100%"}}
                    onMouseEnter={e=>{if(sel===null){e.currentTarget.style.borderColor="#f59e0b";e.currentTarget.style.boxShadow="0 3px 10px rgba(245,158,11,0.18)";}}}
                    onMouseLeave={e=>{if(sel===null){e.currentTarget.style.borderColor="#cbd5e1";e.currentTarget.style.boxShadow="0 1px 3px rgba(0,0,0,0.05)";}}}
                  >
                    <span style={{width:22,height:22,minWidth:22,borderRadius:"50%",background:bBg,color:bC,display:"flex",alignItems:"center",justifyContent:"center",fontSize:10,fontWeight:800,flexShrink:0}}>
                      {sel!==null&&i===q.ans?"✓":sel!==null&&i===sel&&i!==q.ans?"✗":String.fromCharCode(65+i)}
                    </span>
                    {opt}
                  </button>
                );
              })}
            </div>
          </div>
          {sel!==null&&(
            <div style={{background:sel===q.ans?"#f0fdf4":"#fff1f2",border:`1.5px solid ${sel===q.ans?"#86efac":"#fda4af"}`,borderRadius:9,marginTop:6,padding:"8px 10px"}}>
              <p style={{margin:0,fontSize:12,lineHeight:1.75,color:sel===q.ans?"#14532d":"#881337"}}>
                {sel===q.ans?"✅ Correct! ":"❌ Incorrect. "}
                <span style={{color:"#1e293b",fontWeight:500}}>{q.exp}</span>
              </p>
            </div>
          )}
          <button onClick={next} disabled={sel===null} style={{marginTop:12,width:"100%",background:sel===null?"#e2e8f0":"linear-gradient(135deg,#f59e0b,#f97316)",border:"none",borderRadius:11,padding:"14px",fontSize:14,fontWeight:800,color:sel===null?"#94a3b8":"#fff",cursor:sel===null?"default":"pointer",boxShadow:sel===null?"none":"0 4px 16px rgba(245,158,11,0.35)",fontFamily:"inherit",transition:"all 0.2s"}}>
            {cur+1>=qs.length?"نتائج دیکھیں →":"اگلا سوال →"}
          </button>
        </div>
      </div>
    );
  }

  if(screen==="results") return(
    <div style={P}>
      <div style={{maxWidth:680,margin:"0 auto",padding:"20px 14px 28px"}}>
        <div style={{textAlign:"center",marginBottom:24}}>
          <div style={{fontSize:52,marginBottom:6}}>{passed?"🏆":"📚"}</div>
          <h2 style={{fontSize:"clamp(1.6rem,4vw,2.2rem)",fontWeight:900,margin:"0 0 4px",color:passed?"#d97706":"#dc2626"}}>{passed?"آپ پاس ہو گئے!":"مزید پڑھیں"}</h2>
          <p style={{color:"#334155",fontSize:14,margin:0}}>{passed?"Great work — you're ready for the real G1 test!":"Review the explanations and try again."}</p>
        </div>
        <div style={{background:"#fff",border:`2.5px solid ${passed?"#22c55e":"#f43f5e"}`,borderRadius:20,padding:"20px 16px",marginBottom:20,boxShadow:`0 8px 32px ${passed?"rgba(34,197,94,0.15)":"rgba(244,63,94,0.15)"}`,textAlign:"center"}}>
          <div style={{marginBottom:10}}>
            <span style={{fontSize:"clamp(2.8rem,9vw,4.5rem)",fontWeight:900,color:passed?"#16a34a":"#dc2626",lineHeight:1}}>{score}</span>
            <span style={{fontSize:"clamp(1.4rem,5vw,2.3rem)",fontWeight:700,color:"#475569"}}>/{qs.length}</span>
          </div>
          <span style={{background:passed?"#dcfce7":"#fee2e2",color:passed?"#15803d":"#dc2626",border:`2px solid ${passed?"#86efac":"#fca5a5"}`,borderRadius:100,padding:"6px 24px",fontSize:22,fontWeight:900}}>{pct}%</span>
          <div style={{background:"#f1f5f9",borderRadius:8,height:9,margin:"14px auto 0",maxWidth:360}}>
            <div style={{height:"100%",borderRadius:8,background:passed?"linear-gradient(90deg,#22c55e,#16a34a)":"linear-gradient(90deg,#f43f5e,#dc2626)",width:`${pct}%`,transition:"width 0.6s ease"}}/>
          </div>
          <div style={{display:"flex",justifyContent:"center",gap:14,marginTop:14,flexWrap:"wrap"}}>
            {[{l:"درست",v:score,c:"#16a34a",bg:"#dcfce7",i:"✅"},{l:"غلط",v:qs.length-score,c:"#dc2626",bg:"#fee2e2",i:"❌"},{l:"پاس مارک",v:"80%",c:"#d97706",bg:"#fef3c7",i:"🎯"}].map(s=>(
              <div key={s.l} style={{background:s.bg,borderRadius:10,padding:"9px 16px",minWidth:70,textAlign:"center"}}>
                <div style={{fontSize:18}}>{s.i}</div>
                <div style={{fontSize:18,fontWeight:900,color:s.c}}>{s.v}</div>
                <div style={{fontSize:10,color:"#475569",fontWeight:700}}>{s.l}</div>
              </div>
            ))}
          </div>
        </div>
        <p style={{fontSize:10,letterSpacing:3,color:"#475569",textTransform:"uppercase",fontWeight:800,marginBottom:10}}>Question Review</p>
        <div style={{display:"flex",flexDirection:"column",gap:8,marginBottom:24}}>
          {answers.map((a,i)=>{
            const ok=a.sel===a.q.ans;
            const sv=a.q.sv&&S[a.q.sv];
            return(
              <div key={i} style={{background:"#fff",border:`2px solid ${ok?"#22c55e":"#f43f5e"}`,borderRadius:11,padding:"10px 12px",borderLeft:`5px solid ${ok?"#22c55e":"#f43f5e"}`}}>
                <div style={{display:"flex",justifyContent:"space-between",marginBottom:4}}>
                  <span style={{fontSize:10,color:CC[a.q.cat]||"#334155",fontWeight:700}}>{CI[a.q.cat]||"📚"} {a.q.cat}</span>
                  <span style={{fontSize:14}}>{ok?"✅":"❌"}</span>
                </div>
                <div style={{display:"flex",gap:9,alignItems:"center"}}>
                  {sv&&<div style={{background:"#1e293b",borderRadius:7,padding:"3px",flexShrink:0,width:44,height:44,display:"flex",alignItems:"center",justifyContent:"center",overflow:"hidden"}}>{sv(38)}</div>}
                  <div style={{flex:1,minWidth:0}}>
                    <p style={{margin:"0 0 3px",fontSize:12,color:"#1e293b",fontWeight:600}}>{a.q.q}</p>
                    {!ok&&<p style={{margin:0,fontSize:11,wordBreak:"break-word"}}><span style={{color:"#16a34a",fontWeight:700}}>✓ {a.q.opts[a.q.ans]}</span>{a.sel!==null&&<span style={{color:"#dc2626"}}> — Your answer: {a.q.opts[a.sel]}</span>}</p>}
                  </div>
                </div>
              </div>
            );
          })}
        </div>
        <div style={{display:"flex",gap:10,marginBottom:16}}>
          <button onClick={()=>{try{window.parent.document.getElementById("urdupop").style.display="none";}catch(e){window.top.location.href="https://davidsacademy.ca";}}} style={{flex:1,display:"flex",alignItems:"center",justifyContent:"center",gap:6,background:"#CC0000",color:"#fff",fontSize:13,border:"none",fontWeight:800,padding:"13px",borderRadius:11,boxShadow:"0 4px 16px rgba(204,0,0,0.3)",cursor:"pointer",fontFamily:"inherit"}}>🏠 Home</button>
          <button onClick={()=>startAll()} style={{flex:2,background:"linear-gradient(135deg,#f59e0b,#f97316)",border:"none",borderRadius:11,padding:"13px",fontSize:13,fontWeight:800,color:"#fff",cursor:"pointer",fontFamily:"inherit",boxShadow:"0 4px 16px rgba(245,158,11,0.3)"}}>Try Again 🔄</button>
        </div>
      </div>
    </div>
  );

  return null;
}

const root=ReactDOM.createRoot(document.getElementById('root'));
root.render(<App/>);
</script>
</body>
</html>
