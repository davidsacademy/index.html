  {id:"r23",cat:"Rules",sv:null,q:"Before leaving your car parked on a downgrade WITH a curb, you should:",opts:["Leave front wheels parallel to curb","Turn wheels left — set parking brake","Set parking brake only","Turn wheels right — set parking brake"],ans:3,exp:"On a downgrade with a curb, turn wheels right so car rolls into curb if brakes fail."},
  {id:"r24",cat:"Rules",sv:null,q:"When driving in heavy fog, you should use:",opts:["High beam headlights","Low beam headlights","Parking lights only","No lights — they reflect back"],ans:1,exp:"In heavy fog, use low beam headlights — high beams reflect off fog and reduce visibility."},
  {id:"r25",cat:"Rules",sv:null,q:"The best way to stop quickly on a wet or icy roadway is:",opts:["Pump the brake pedal steadily","Keep foot off brake — let compression stop you","Slam the brake hard","Apply brakes the same as always"],ans:0,exp:"Pump the brake pedal steadily on wet or icy roads to avoid locking the wheels."},
  {id:"r26",cat:"Rules",sv:null,q:"Maximum speed on Ontario provincial highways unless otherwise posted:",opts:["80 km/h","90 km/h","100 km/h","110 km/h"],ans:2,exp:"The default maximum speed on Ontario highways is 100 km/h."},
  {id:"r27",cat:"Rules",sv:null,q:"Default speed limit in cities, towns, villages and built-up areas:",opts:["40 km/h","50 km/h","60 km/h","70 km/h"],ans:1,exp:"The default urban speed limit is 50 km/h unless otherwise posted."},
  {id:"r28",cat:"Rules",sv:null,q:"Legal blood alcohol concentration (BAC) limit for fully licensed Ontario drivers:",opts:["0.00%","0.05%","0.08%","0.10%"],ans:2,exp:"Legal BAC limit is 0.08%. BAC between 0.05–0.08% triggers an immediate roadside suspension."},
  {id:"r29",cat:"Rules",sv:null,q:"The BAC limit for G1 and G2 drivers in Ontario is:",opts:["0.05%","0.08%","0.00%","0.03%"],ans:2,exp:"G1 and G2 novice drivers must maintain a BAC of exactly zero at all times."},
  {id:"r30",cat:"Rules",sv:null,q:"If you refuse a breathalyzer test, your licence is suspended immediately for:",opts:["30 days","60 days","1 year","90 days"],ans:3,exp:"Refusing a breathalyzer test results in an immediate 90-day licence suspension."},
  {id:"r31",cat:"Rules",sv:null,q:"Your G1 supervising driver must hold a full G licence for at least:",opts:["1 year","2 years","4 years","6 years"],ans:2,exp:"Your G1 supervising driver must hold a full Class G licence with at least 4 years experience."},
  {id:"r32",cat:"Rules",sv:null,q:"G1 drivers are NOT permitted to drive between:",opts:["10 pm–5 am","11 pm–6 am","Midnight–5 am","9 pm–6 am"],ans:2,exp:"G1 drivers must not drive between midnight and 5:00 a.m."},
  {id:"r33",cat:"Rules",sv:null,q:"The Ontario Graduated Licensing System takes a minimum of:",opts:["12 months","18 months","20 months","24 months"],ans:2,exp:"The Graduated Licensing System takes a minimum of 20 months to complete."},
  {id:"r34",cat:"Rules",sv:null,q:"As a G1 or G2 driver, accumulating 9 or more demerit points results in a suspension of:",opts:["60 days","30 days","15 days","1 year"],ans:1,exp:"G1 and G2 drivers receive a 30-day suspension for accumulating 9 or more demerit points."},
  {id:"r35",cat:"Rules",sv:null,q:"Failing to stop for a school bus earns how many demerit points?",opts:["2 points","4 points","6 points","7 points"],ans:2,exp:"Failing to stop for a school bus results in 6 demerit points and a fine up to $1,000."},
  {id:"r36",cat:"Rules",sv:null,q:"At 15 demerit points, your licence is automatically suspended for:",opts:["30 days","60 days","90 days","3 months"],ans:0,exp:"At 15 demerit points, your licence is automatically suspended for 30 days."},
  {id:"r37",cat:"Rules",sv:null,q:"Demerit points remain on your driving record for how long?",opts:["1 year from offence","2 years from offence","3 years from offence","5 years from offence"],ans:1,exp:"Demerit points remain on your driving record for 2 years from the date of the offence."},
  {id:"r38",cat:"Rules",sv:null,q:"Careless driving earns how many demerit points?",opts:["3 points","4 points","6 points","7 points"],ans:2,exp:"Careless driving results in 6 demerit points."},
  {id:"r39",cat:"Rules",sv:null,q:"When stopping for a streetcar (no safety island), you must stop:",opts:["1 metre behind","At least 2 metres behind the rearmost door","5 metres behind","At the nearest crosswalk"],ans:1,exp:"Stop at least 2 metres behind the rearmost door of a stopped streetcar where there is no safety island."},
  {id:"r40",cat:"Rules",sv:null,q:"When two cars reach an uncontrolled intersection at the same time, right-of-way goes to:",opts:["The one approaching from the left","The one approaching from the right","Neither one","The one moving faster"],ans:1,exp:"The vehicle approaching from the right has right-of-way at an uncontrolled intersection."},
  {id:"r41",cat:"Rules",sv:null,q:"How close to a fire hydrant may you legally park?",opts:["3 metres (10 ft.)","4.5 metres (15 ft.)","1.5 metres (5 ft.)","6 metres (20 ft.)"],ans:0,exp:"You may not park within 3 metres (10 feet) of a fire hydrant."},
  {id:"r42",cat:"Rules",sv:null,q:"When parking on a hill going UPHILL with a curb, you should:",opts:["Turn wheels right and set parking brake","Turn wheels left and set parking brake","Leave wheels straight — set parking brake","Leave wheels parallel to curb"],ans:1,exp:"Uphill with a curb — turn wheels left (away from curb) so vehicle rolls into curb if brakes fail."},
  {id:"r43",cat:"Rules",sv:null,q:"When lights are required, use low beam when following another vehicle within:",opts:["Within 30 m (100 ft.)","Within 60 m (200 ft.)","Within 120 m (400 ft.)","Any time following a vehicle"],ans:1,exp:"Use low beam headlights when following another vehicle within 60 metres (200 feet)."},
  {id:"r44",cat:"Rules",sv:null,q:"While travelling on a highway, the driver of a motor vehicle is not permitted to carry persons in a house or boat trailer because:",opts:["Firearms — prohibited","Flammable material — prohibited","Persons — not permitted","Pets — not permitted"],ans:2,exp:"You may not carry passengers in a house trailer or boat trailer while travelling on a highway."},
  {id:"r45",cat:"Rules",sv:null,q:"When you hear a siren on a two-way street, you must:",opts:["Speed up and get out of the way","Signal the driver to pass","Pull to the right as far as possible and stop","Continue at the same speed"],ans:2,exp:"When an emergency vehicle approaches, pull to the right as far as possible and stop."},
  {id:"r46",cat:"Rules",sv:null,q:"You are required to keep a safe distance behind a vehicle at 50 km/h — at least:",opts:["Seven car lengths","Three car lengths","One car length","Five car lengths"],ans:1,exp:"At 50 km/h you should keep at least three car lengths (about 2 seconds) behind the vehicle ahead."},
  {id:"r47",cat:"Rules",sv:null,q:"A flashing GREEN light at an intersection (where left and right turns are permitted) means:",opts:["You may turn left if way is clear","You may turn right if way is clear","You may proceed straight if way is clear","You may do any of the above"],ans:3,exp:"A flashing green gives you right-of-way to go straight or turn — all other traffic faces a red."},
  {id:"r48",cat:"Rules",sv:null,q:"Overdriving your headlights at night is dangerous because:",opts:["You are driving too fast","Your headlights are too bright","You cannot stop within the distance you can see","It is not good for the battery"],ans:2,exp:"Overdriving headlights means you cannot stop within the lit distance — very dangerous."},
  {id:"r49",cat:"Rules",sv:null,q:"In Ontario, is there a seat belt law?",opts:["Yes — everyone must wear a seat belt","No","Only when driving on an open highway","Only when driving within a municipality"],ans:0,exp:"Ontario law requires all occupants to wear a seat belt at all times while the vehicle is in motion."},
  {id:"r50",cat:"Rules",sv:null,q:"If someone is tailgating you, what should you do?",opts:["Move into another lane when safe","Slow down slightly to increase space in front","Pull over to let the tailgater pass","All of the above"],ans:3,exp:"You can move lanes, slow down to increase space, or pull over — all are appropriate responses to a tailgater."},
  {id:"r51",cat:"Rules",sv:null,q:"When a car is stopped to allow a pedestrian to cross at a marked crosswalk, you should:",opts:["Pass the stopped car on the left","Sound horn for the driver to move","Pass the stopped car on the right","Not pass any car stopped to allow a pedestrian to cross"],ans:3,exp:"Never pass a vehicle stopped to allow a pedestrian to cross — the pedestrian may be in your path."},
  {id:"r52",cat:"Rules",sv:null,q:"To what penalties is a driver liable who is convicted of driving while disqualified?",opts:["Fine of $500 or 6 months imprisonment or both","Impoundment for 3 months","Additional 6-month suspension","Any or all of the above"],ans:3,exp:"Driving while disqualified can result in fines, imprisonment, vehicle impoundment, and further suspension."},
  {id:"r53",cat:"Rules",sv:null,q:"When the traffic signal changes from green to amber as you approach, you should:",opts:["Stop if a safe stop can be made, otherwise proceed with caution","Speed up to clear the intersection","Continue without slowing","Sound horn to warn pedestrians"],ans:0,exp:"On an amber (yellow) light — stop if you can safely do so; otherwise proceed carefully."},
  {id:"r54",cat:"Rules",sv:null,q:"When a streetcar stops to take on or discharge passengers AND there is a safety island, you should:",opts:["Pass with caution at a reasonable speed","Stop at least 2 metres behind the safety island","Sound horn and pass","Pass on the left when clear"],ans:0,exp:"Where a safety island exists, you may pass the streetcar with caution at a reasonable speed."},
  {id:"r55",cat:"Rules",sv:null,q:"A person whose driver's licence is under suspension may:",opts:["Drive in a case of extreme emergency","Drive to and from work","Drive when accompanied by a licensed driver","Not operate a motor vehicle under any conditions"],ans:3,exp:"A suspended driver may NOT drive under any circumstances — there are no exceptions."},
  {id:"r56",cat:"Rules",sv:null,q:"After a 15-demerit-point suspension, when the licence is reinstated, the point total is:",opts:["Reduced to 7 points","Reduced to 9 points","Remains the same","Deleted from record"],ans:0,exp:"After a 15-point suspension, upon reinstatement the demerit point total is reduced to 7 points."},
  {id:"r57",cat:"Rules",sv:null,q:"You should reduce your speed below posted limits for which reason?",opts:["Bad weather conditions","When approaching and crossing an intersection","In rush hour with stop-and-go traffic","All of the above"],ans:3,exp:"You should reduce speed for bad weather, intersections, and congested traffic — all are valid reasons."},
  {id:"r58",cat:"Rules",sv:null,q:"When passing a motorcycle, you should:",opts:["Honk your horn before you pass","Turn on your high beams before you pass","Pass just as you would with another car","Use half of their lane to pass"],ans:2,exp:"Pass a motorcycle the same way you would any other vehicle — safely and with full lane clearance."},
  {id:"r59",cat:"Rules",sv:null,q:"As a G2 teenage driver in the first 6 months of your G2 licence, between midnight and 5 a.m. you may carry:",opts:["3 passengers aged 19 or under","No passengers aged 19 or under","1 passenger aged 19 or under","2 passengers aged 19 or under"],ans:2,exp:"In the first 6 months of G2, between midnight and 5 a.m., you may carry only 1 passenger aged 19 or under."},
  {id:"r60",cat:"Rules",sv:null,q:"What insurance protection does the owner get who pays the uninsured motor vehicle fee?",opts:["$10,000 coverage","$20,000 coverage","$35,000 coverage","No insurance protection whatsoever"],ans:3,exp:"Paying the uninsured vehicle fee provides NO insurance protection — it only allows you to register the vehicle."},
  {id:"r61",cat:"Rules",sv:null,q:"When approaching a railway crossing with a warning signal device, you must stop:",opts:["Not less than 1.5 m from the nearest rail","Increase speed and cross quickly","Not less than 5 m from the nearest rail","Slow down and proceed with caution"],ans:2,exp:"You must stop not less than 5 metres (15 feet) from the nearest rail at a signalled railway crossing."},
  {id:"r62",cat:"Rules",sv:null,q:"Parking lights may be used:",opts:["At any time","For parking only","When driving in heavy fog","When driving on a well-lit street"],ans:1,exp:"Parking lights are intended for parking only — they must not be used as a substitute for headlights while driving."},
  {id:"r63",cat:"Rules",sv:null,q:"When a driver is about to overtake and pass your vehicle, you must:",opts:["Speed up so passing is not necessary","Signal the other driver not to pass","Move to the right and allow the vehicle to pass","Move to the left to prevent passing"],ans:2,exp:"Move to the right and allow the overtaking vehicle to pass safely."},
  {id:"r64",cat:"Rules",sv:null,q:"Are drivers responsible for ensuring their passengers buckle up?",opts:["Only if passengers are over 16 years of age","Only if passengers are 5 to 16 years of age","Only if passengers are in the front seat","Only if passengers are over 18 years of age"],ans:1,exp:"Drivers are responsible for ensuring passengers aged 5 to 16 are buckled up. Adults 16+ are responsible for themselves."},
  {id:"r65",cat:"Rules",sv:null,q:"How soon after a licensed driver changes name or address must the Ministry be notified?",opts:["Within 6 days","Within 15 days","Within 30 days","At any time prior to licence renewal"],ans:0,exp:"A driver must notify the Ministry of Transportation within 6 days of a name or address change."},
  {id:"r66",cat:"Rules",sv:null,q:"When passing other vehicles on the right side is permitted:",opts:["On any street or highway","Only by driving on the shoulder of the road","Not permitted under any circumstances","When the street or highway has two or more lanes in your direction"],ans:3,exp:"Passing on the right is permitted when the road has two or more lanes of traffic in your direction."},
  {id:"r67",cat:"Rules",sv:null,q:"When a red signal shows a green arrow, you may:",opts:["Stop and wait for green light before turning in arrow direction","Proceed with caution in the arrow direction, yielding to pedestrians","Stop and then proceed","The green arrow is for pedestrians only"],ans:1,exp:"A green arrow with a red light means proceed in the arrow direction with caution, yielding to pedestrians."},
  {id:"r68",cat:"Rules",sv:null,q:"When exiting an expressway, you should:",opts:["Give yourself time to move to the exit lane","Slow down smoothly to posted speed on exit ramp","Signal and maintain speed until off the ramp","All of the above"],ans:3,exp:"When exiting: plan ahead, move to the exit lane early, slow on the ramp, and maintain safe speed."},
  {id:"r69",cat:"Rules",sv:null,q:"If two drivers enter an intersection from opposite directions, one turning left and one going straight, which has right-of-way?",opts:["The one turning left","The one going straight","Both have right-of-way","Both must stop first then proceed"],ans:1,exp:"The vehicle going straight has the right-of-way over a vehicle making a left turn."},
  {id:"r70",cat:"Rules",sv:null,q:"When getting out of your car on a busy street, you should open your door:",opts:["After making proper signals","When you turn on your four-way flashers","When you are sure it can be done safely","It does not matter"],ans:2,exp:"Only open your door when you are sure it is safe — check for cyclists and traffic before opening."},
  {id:"r71",cat:"Rules",sv:null,q:"A flashing blue light mounted on a motor vehicle indicates:",opts:["A vehicle carrying explosives","Snow removal equipment","An ambulance","A police emergency vehicle"],ans:1,exp:"A flashing blue light on a vehicle indicates snow removal equipment — give it extra space."},
  {id:"r72",cat:"Rules",sv:null,q:"Except when passing, what distance must commercial vehicles maintain between each other on a highway outside a city?",opts:["30 m (100 ft)","60 m (200 ft)","120 m (400 ft)","150 m (500 ft)"],ans:1,exp:"Commercial vehicles travelling in the same direction outside a city must maintain at least 60 metres (200 feet) apart."},
  {id:"r73",cat:"Rules",sv:null,q:"If involved in a reportable accident, how soon must you report to police?",opts:["At once","Within 24 hours","Within 48 hours","Within 72 hours"],ans:0,exp:"You must report a collision involving injury or significant damage to police immediately."},
  {id:"r74",cat:"Rules",sv:null,q:"When approaching a red light and a police officer motions you through, you must:",opts:["Go through at once","Call the officer's attention to the red light","Stop to make sure the officer wants you through","Wait for the light to turn green"],ans:0,exp:"A police officer's signals override traffic signals — obey the officer and go through."},
  {id:"r75",cat:"Rules",sv:null,q:"When may a driver make a left turn on a red light?",opts:["When the way is clear","On any red light","From a one-way street into a one-way street, after a full stop, when the way is clear","From a two-way street into a two-way street when clear"],ans:2,exp:"In Ontario, you may turn left on a red light from a one-way street into a one-way street, after stopping and yielding."},
  {id:"r76",cat:"Rules",sv:null,q:"If a tire blows out while driving, you should:",opts:["Concentrate on steering only","Take your foot off the gas and steer to safety","Bring the vehicle to a stop off the road","All of the above"],ans:3,exp:"During a blowout: ease off the gas, concentrate on steering, and bring the vehicle safely to the side of the road."},
  {id:"r77",cat:"Rules",sv:null,q:"Most automobile skids are the result of:",opts:["Under-inflated tires","Over-inflated tires","Snow or ice on the road","Driving too fast"],ans:3,exp:"Most skids are caused by driving too fast for the road conditions."},
  {id:"r78",cat:"Rules",sv:null,q:"While driving around a curve, a good practice is to:",opts:["Ride in the centre of the road","Enter the curve at steady speed and apply brakes if needed","Slow down only when pavement is slippery","Enter slowly and increase speed gradually through the curve"],ans:3,exp:"Enter a curve slowly and gradually increase speed as you feel the curve — never brake sharply mid-curve."},
  {id:"r79",cat:"Rules",sv:null,q:"What must a driver do before entering a highway from a private road or driveway?",opts:["Sound horn and proceed with caution","Enter as quickly as possible","Yield right-of-way to all approaching highway vehicles","Give hand signal then take right-of-way"],ans:2,exp:"You must yield to all traffic on the highway before entering from a private road or driveway."},
  {id:"r80",cat:"Rules",sv:null,q:"It is more dangerous to drive at maximum speed at night than daytime because:",opts:["Roads are more slippery at night","You cannot see as far ahead at night","Your reaction time is slower at night","Some drivers use only parking lights"],ans:1,exp:"At night, reduced visibility means you cannot see as far ahead — your stopping distance may exceed your sight distance."},
  {id:"r81",cat:"Rules",sv:null,q:"When should you use low beam headlights when approaching another vehicle?",opts:["Within 1 km","Within 150 m (500 ft)","Within 300 m (1000 ft)","This is a safety practice, not a law"],ans:1,exp:"Switch to low beams within 150 metres (500 feet) of an oncoming vehicle to avoid blinding the other driver."},
  {id:"r82",cat:"Rules",sv:null,q:"If you are convicted of drinking and driving, you will lose your licence on the first offence for:",opts:["1 month","3 months","6 months","1 year"],ans:3,exp:"A first criminal conviction for drinking and driving results in a 1-year licence suspension."},
  {id:"r83",cat:"Rules",sv:null,q:"At what BAC level can you be convicted of being an impaired driver in Ontario?",opts:["0.03%","0.05%","0.08%","1.0%"],ans:2,exp:"In Ontario, a BAC of 0.08% or higher is the criminal level for impaired driving."},
  {id:"r84",cat:"Rules",sv:null,q:"Every accident must be reported to police when damage exceeds:",opts:["$100","$500","$1,000","$2,000"],ans:3,exp:"Accidents must be reported to police when total damage exceeds $2,000 or someone is injured or killed."},
  {id:"r85",cat:"Rules",sv:null,q:"In what position must you be before making a left turn from a one-way street?",opts:["Close to the right-hand side","Close to the centre line","Close to the left side","Does not matter provided you signal"],ans:2,exp:"When turning left from a one-way street, position your vehicle close to the left side of the roadway."},
  {id:"r86",cat:"Rules",sv:null,q:"When may you lend your driver's licence?",opts:["Never","To a person learning to drive","For identification purposes only","In emergencies"],ans:0,exp:"You may never lend your driver's licence to another person under any circumstances."},
  {id:"r87",cat:"Rules",sv:null,q:"When making a right turn, which hand and arm signal is correct?",opts:["Arm out and down","Arm out and up","Circle motion","Arm straight out of window"],ans:1,exp:"For a right turn, extend your left arm out the window with the elbow bent and hand pointing upward."},
  {id:"r88",cat:"Rules",sv:null,q:"Under which conditions is it dangerous and unlawful to make a U-turn?",opts:["On a curve or hill with less than 150m view","At a railway crossing or within 30m of one","Within 150m of a bridge, viaduct or tunnel if view is obstructed","All of the above"],ans:3,exp:"U-turns are illegal on curves, hills, near railway crossings, and near bridges where visibility is limited."},
  {id:"r89",cat:"Rules",sv:null,q:"Before moving your car from a parked position, you should:",opts:["Signal and pull from curb","Sound horn and pull slowly","Check traffic, signal and pull quickly","Check traffic, signal and pull out only when safe"],ans:3,exp:"Before pulling from the curb: check all traffic, signal your intent, and pull out only when it is safe to do so."},
  {id:"r90",cat:"Rules",sv:null,q:"When a truck is disabled on the highway where speed limit exceeds 60 km/h, flares or reflectors must be placed approximately how far ahead and behind the vehicle?",opts:["15 m (50 ft)","30 m (100 ft)","60 m (200 ft)","90 m (300 ft)"],ans:1,exp:"Flares or reflectors must be placed approximately 30 metres (100 feet) ahead of and behind a disabled truck on a high-speed highway."},
  {id:"r91",cat:"Rules",sv:null,q:"If you have a G1 or G2 licence and are found driving under the influence of alcohol:",opts:["You will be called for an interview","Your licence will be cancelled","You will receive a warning letter","Your licence will be suspended for 30 days and you may be charged under the Criminal Code"],ans:3,exp:"G1 and G2 drivers caught drinking and driving face a 30-day licence suspension and potential Criminal Code charges."},
  {id:"r92",cat:"Rules",sv:null,q:"When there is a cyclist in your lane, you should:",opts:["Blow the horn and pass","Pass the cyclist in the same lane","Check mirrors, signal, check blind spot, and if safe change lanes to pass","Wait for the cyclist to give way, then pass"],ans:2,exp:"Check mirrors, signal, verify your blind spot is clear, then safely change lanes to pass a cyclist."},
  {id:"r93",cat:"Rules",sv:null,q:"Hydroplaning occurs in heavy rain when tires ride up on water. To help prevent it, you should:",opts:["Ensure tires have good tread depth","Ensure tires are inflated to proper pressure","Reduce vehicle speed when driving in rain","All of the above"],ans:3,exp:"Prevent hydroplaning by maintaining good tire tread depth, proper inflation, and reducing speed in rain."},
  {id:"r94",cat:"Rules",sv:null,q:"The two-second rule is used to determine:",opts:["How fast you can react to obstacles","How fast you are travelling","How much gas you will save","If you are following at a safe distance"],ans:3,exp:"The two-second rule helps you check whether you are following the vehicle ahead at a safe distance."},
  {id:"r95",cat:"Rules",sv:null,q:"When approaching a construction area, drivers should:",opts:["Honk to let workers know you're approaching","Watch for children","Slow down and yield the right-of-way","Speed up to get through quickly"],ans:2,exp:"In construction zones, slow down and yield the right-of-way — worker safety depends on it."},
  {id:"r96",cat:"Rules",sv:null,q:"When are broken white lines (dashes) used on streets and highways?",opts:["On a two-way street only","When it is a no-stopping zone","When passing is permitted","On a one-way street or highway with multiple lanes in the same direction"],ans:3,exp:"Broken white lines separate same-direction lanes on one-way streets and multi-lane highways."},
  {id:"r97",cat:"Rules",sv:null,q:"If the traffic lights are not working and no one is directing traffic, you should:",opts:["Stop and go straight","Blow the horn and go straight","Check left and right before proceeding","Treat it like a four-way stop sign"],ans:3,exp:"When traffic signals are out of order and no officer is present, treat the intersection as a four-way stop."},
  {id:"r98",cat:"Rules",sv:null,q:"If you become very tired while driving, you should:",opts:["Stop and rest","Drink coffee","Drive faster to reach your destination","Open windows to allow fresh air"],ans:0,exp:"The only safe solution when tired is to stop and rest — other measures are ineffective and dangerous."},
];

const SETS = [
  {label:"Signs Q1–20",  key:"s1", cat:"Signs", pool:ALL_SIGNS.slice(0,20),  count:20},
  {label:"Signs Q21–40", key:"s2", cat:"Signs", pool:ALL_SIGNS.slice(20,40), count:20},
  {label:"Signs Q41–54", key:"s3", cat:"Signs", pool:ALL_SIGNS.slice(40,54), count:14},
  {label:"Rules Q1–25",  key:"r1", cat:"Rules", pool:ALL_RULES.slice(0,25),  count:25},
  {label:"Rules Q26–55", key:"r2", cat:"Rules", pool:ALL_RULES.slice(25,55), count:30},
  {label:"Rules Q56–98", key:"r3", cat:"Rules", pool:ALL_RULES.slice(55,98), count:43},
];

const CC={Signs:"#d97706",Rules:"#059669"};
const CB={Signs:"#fef3c7",Rules:"#d1fae5"};
const CI={Signs:"🚦",Rules:"📋"};

function App(){
  const [screen,setScreen]=useState("home");
  const [notice,setNotice]=useState(true);
  const [cur,setCur]=useState(0);
  const [sel,setSel]=useState(null);
  const [answers,setAnswers]=useState([]);
  const [qs,setQs]=useState([]);
  const [time,setTime]=useState(null);
  const [tOn,setTOn]=useState(false);
  const [setLabel,setSetLabel]=useState("");

  const startSet=(setObj)=>{
    const pool=[...setObj.pool].sort(()=>Math.random()-0.5);
    setQs(pool);setAnswers([]);setCur(0);setSel(null);
    setTime(pool.length*35);setTOn(true);setSetLabel(setObj.label);
    setScreen("quiz");
  };
  const startAll=()=>{
    const pool=[...ALL_SIGNS,...ALL_RULES].sort(()=>Math.random()-0.5).slice(0,40);
    setQs(pool);setAnswers([]);setCur(0);setSel(null);
    setTime(40*35);setTOn(true);setSetLabel("Practice Test — All 40 Questions");
    setScreen("quiz");
  };

  useEffect(()=>{
    if(!tOn||time===null)return;
    if(time<=0){fin();return;}
    const t=setTimeout(()=>setTime(v=>v-1),1000);
    return()=>clearTimeout(t);
  },[tOn,time]);

  const pick=(i)=>{if(sel!==null)return;setSel(i);};
  const next=()=>{
    const na=[...answers,{q:qs[cur],sel}];
    if(cur+1>=qs.length){setAnswers(na);fin(na);}
    else{setAnswers(na);setCur(c=>c+1);setSel(null);}
  };
  const fin=(f)=>{setTOn(false);setAnswers(f||answers);setScreen("results");};
  const fmt=(s)=>`${Math.floor(s/60)}:${String(s%60).padStart(2,"0")}`;
  const score=answers.filter(a=>a.sel===a.q.ans).length;
  const pct=qs.length>0?Math.round((score/qs.length)*100):0;
  const passed=pct>=80;
  const P={minHeight:"100vh",background:"linear-gradient(160deg,#f0f9ff 0%,#e0f2fe 40%,#f0fdf4 100%)",fontFamily:"'Segoe UI',system-ui,sans-serif",color:"#1e293b",padding:0};

  if(screen==="home") return(
    <div style={P}>
      <div style={{maxWidth:680,margin:"0 auto",padding:"12px 14px 12px"}}>

        <p style={{fontSize:9,letterSpacing:2,color:"#059669",textTransform:"uppercase",fontWeight:800,marginBottom:3}}>📋 Driving Rules ({ALL_RULES.length} questions)</p>
        <div style={{display:"grid",gridTemplateColumns:"1fr 1fr 1fr",gap:6,marginBottom:8}}>
          {SETS.filter(s=>s.cat==="Rules").map(set=>(
            <button key={set.key} onClick={()=>startSet(set)} style={{background:"#059669",border:"2px solid #047857",borderRadius:10,padding:"8px 8px",cursor:"pointer",textAlign:"left",transition:"all 0.18s",boxShadow:"0 2px 8px rgba(0,0,0,0.05)"}}
              onMouseEnter={e=>{e.currentTarget.style.transform="translateY(-2px)";e.currentTarget.style.boxShadow="0 8px 20px rgba(5,150,105,0.4)";}}
              onMouseLeave={e=>{e.currentTarget.style.transform="translateY(0)";e.currentTarget.style.boxShadow="0 2px 8px rgba(0,0,0,0.05)";}}>
              <div style={{fontWeight:800,fontSize:11,color:"#fff"}}>{set.label}</div>
              <div style={{fontSize:9,color:"#6ee7b7",marginTop:1,fontWeight:700}}>{set.count} Qs</div>
            </button>
          ))}
        </div>

        <div style={{background:"#fffbeb",border:"1.5px solid #fde68a",borderRadius:10,padding:"6px 10px",marginBottom:6}}>
          <p style={{margin:0,color:"#78350f",fontSize:10,lineHeight:1.5}}>💡 <strong>Real G1 Test:</strong> 40 questions — 20 signs + 20 rules. Max 4 wrong per section. Pass = <strong>80%</strong>.</p>
        </div>
        <div style={{textAlign:"center"}}>
          <button onClick={()=>{try{window.parent.document.getElementById("g1pop").style.display="none";}catch(e){window.top.location.href="https://davidsacademy.ca";}}} style={{display:"inline-flex",alignItems:"center",gap:8,background:"#CC0000",color:"#fff",fontSize:14,border:"none",fontWeight:800,padding:"10px 24px",borderRadius:10,boxShadow:"0 4px 16px rgba(204,0,0,0.3)",cursor:"pointer",fontFamily:"inherit"}}>🏠 Home</button>
        </div>
      </div>
    </div>
  );

  if(screen==="quiz"&&qs.length>0){
    const q=qs[cur];
    const sv=q.sv&&S[q.sv];
    return(
      <div style={P}>
        <div style={{maxWidth:680,margin:"0 auto",padding:"12px 14px"}}>
          <div style={{display:"flex",justifyContent:"space-between",alignItems:"center",marginBottom:14}}>
            <button onClick={()=>{setTOn(false);setScreen("home");}} style={{background:"#fff",border:"1.5px solid #cbd5e1",color:"#1e293b",borderRadius:10,padding:"6px 12px",cursor:"pointer",fontSize:13,fontWeight:700}}>← Quit</button>
            <div style={{fontSize:11,color:"#64748b",fontWeight:700,textAlign:"center",flex:1,margin:"0 8px",overflow:"hidden",textOverflow:"ellipsis",whiteSpace:"nowrap"}}>{setLabel}</div>
            <div style={{display:"flex",gap:8,alignItems:"center",flexShrink:0}}>
              <span style={{fontSize:12,color:"#334155",fontWeight:700}}>{cur+1}/{qs.length}</span>
              <div style={{background:time<30?"#fee2e2":"#dcfce7",border:`1.5px solid ${time<30?"#fca5a5":"#86efac"}`,borderRadius:10,padding:"4px 10px",fontSize:13,fontWeight:800,color:time<30?"#dc2626":"#16a34a",fontFamily:"monospace"}}>⏱{fmt(time)}</div>
            </div>
          </div>
          <div style={{background:"#e2e8f0",borderRadius:6,height:5,marginBottom:16}}>
            <div style={{height:"100%",borderRadius:6,background:"linear-gradient(90deg,#f59e0b,#f97316)",width:`${((cur+1)/qs.length)*100}%`,transition:"width 0.4s ease"}}/>
          </div>
          <span style={{background:CB[q.cat]||"#f1f5f9",color:CC[q.cat]||"#334155",border:`1.5px solid ${(CC[q.cat]||"#94a3b8")+"55"}`,borderRadius:100,padding:"4px 12px",fontSize:11,fontWeight:700}}>{CI[q.cat]||"📚"} {q.cat}</span>
          <div style={{background:"#fff",border:"1.5px solid #e2e8f0",borderRadius:12,padding:"9px 12px",marginTop:6,marginBottom:8,boxShadow:"0 2px 6px rgba(0,0,0,0.06)"}}>
            <p style={{fontSize:13,fontWeight:700,margin:0,lineHeight:1.4,color:"#0f172a"}}>{q.q}</p>
          </div>
          <div style={{display:"flex",gap:8,alignItems:"flex-start"}}>
            {sv&&(
              <div style={{background:"linear-gradient(145deg,#1a2535,#2d3f55)",borderRadius:12,padding:"7px",display:"flex",flexDirection:"column",alignItems:"center",justifyContent:"center",boxShadow:"0 3px 10px rgba(0,0,0,0.22)",width:80,minWidth:80,flexShrink:0}}>
                <div style={{background:"#2a2a2a",borderRadius:6,padding:"3px"}}>{sv(62)}</div>
                <p style={{margin:"3px 0 0",fontSize:6,color:"#7a8fa6",letterSpacing:0.5,textTransform:"uppercase",fontWeight:600}}>ON Sign</p>
              </div>
            )}
            <div style={{flex:1,display:"flex",flexDirection:"column",gap:5}}>
              {q.opts.map((opt,i)=>{
                let bg="#fff",border="1.5px solid #cbd5e1",color="#0f172a",bBg="#e2e8f0",bC="#1e293b";
                if(sel!==null){
                  if(i===q.ans){bg="#f0fdf4";border="2px solid #22c55e";color="#14532d";bBg="#22c55e";bC="#fff";}
                  else if(i===sel&&i!==q.ans){bg="#fff1f2";border="2px solid #f43f5e";color="#881337";bBg="#f43f5e";bC="#fff";}
                }
                return(
                  <button key={i} onClick={()=>pick(i)} disabled={sel!==null} style={{background:bg,border,color,borderRadius:9,padding:"7px 9px",cursor:sel!==null?"default":"pointer",textAlign:"left",fontSize:12,fontFamily:"inherit",fontWeight:600,transition:"all 0.18s",display:"flex",gap:7,alignItems:"center",boxShadow:"0 1px 3px rgba(0,0,0,0.05)",width:"100%"}}
                    onMouseEnter={e=>{if(sel===null){e.currentTarget.style.borderColor="#f59e0b";e.currentTarget.style.boxShadow="0 3px 10px rgba(245,158,11,0.18)";}}}
                    onMouseLeave={e=>{if(sel===null){e.currentTarget.style.borderColor="#cbd5e1";e.currentTarget.style.boxShadow="0 1px 3px rgba(0,0,0,0.05)";}}}
                  >
                    <span style={{width:22,height:22,minWidth:22,borderRadius:"50%",background:bBg,color:bC,display:"flex",alignItems:"center",justifyContent:"center",fontSize:10,fontWeight:800,flexShrink:0}}>
                      {sel!==null&&i===q.ans?"✓":sel!==null&&i===sel&&i!==q.ans?"✗":String.fromCharCode(65+i)}
                    </span>
                    {opt}
                  </button>
                );
              })}
            </div>
          </div>
          {sel!==null&&(
            <div style={{background:sel===q.ans?"#f0fdf4":"#fff1f2",border:`1.5px solid ${sel===q.ans?"#86efac":"#fda4af"}`,borderRadius:9,marginTop:6,padding:"8px 10px"}}>
              <p style={{margin:0,fontSize:12,lineHeight:1.75,color:sel===q.ans?"#14532d":"#881337"}}>
                {sel===q.ans?"✅ Correct! ":"❌ Incorrect. "}
                <span style={{color:"#1e293b",fontWeight:500}}>{q.exp}</span>
              </p>
            </div>
          )}
          <button onClick={next} disabled={sel===null} style={{marginTop:12,width:"100%",background:sel===null?"#e2e8f0":"linear-gradient(135deg,#f59e0b,#f97316)",border:"none",borderRadius:11,padding:"14px",fontSize:14,fontWeight:800,color:sel===null?"#94a3b8":"#fff",cursor:sel===null?"default":"pointer",boxShadow:sel===null?"none":"0 4px 16px rgba(245,158,11,0.35)",fontFamily:"inherit",transition:"all 0.2s"}}>
            {cur+1>=qs.length?"See Results →":"Next Question →"}
          </button>
        </div>
      </div>
    );
  }

  if(screen==="results") return(
    <div style={P}>
      <div style={{maxWidth:680,margin:"0 auto",padding:"20px 14px 28px"}}>
        <div style={{textAlign:"center",marginBottom:24}}>
          <div style={{fontSize:52,marginBottom:6}}>{passed?"🏆":"📚"}</div>
          <h2 style={{fontSize:"clamp(1.6rem,4vw,2.2rem)",fontWeight:900,margin:"0 0 4px",color:passed?"#d97706":"#dc2626"}}>{passed?"You Passed!":"Keep Studying"}</h2>
          <p style={{color:"#334155",fontSize:14,margin:0}}>{passed?"Great work — you're ready for the real G1 test!":"Review the explanations and try again."}</p>
        </div>
        <div style={{background:"#fff",border:`2.5px solid ${passed?"#22c55e":"#f43f5e"}`,borderRadius:20,padding:"20px 16px",marginBottom:20,boxShadow:`0 8px 32px ${passed?"rgba(34,197,94,0.15)":"rgba(244,63,94,0.15)"}`,textAlign:"center"}}>
          <div style={{marginBottom:10}}>
            <span style={{fontSize:"clamp(2.8rem,9vw,4.5rem)",fontWeight:900,color:passed?"#16a34a":"#dc2626",lineHeight:1}}>{score}</span>
            <span style={{fontSize:"clamp(1.4rem,5vw,2.3rem)",fontWeight:700,color:"#475569"}}>/{qs.length}</span>
          </div>
          <span style={{background:passed?"#dcfce7":"#fee2e2",color:passed?"#15803d":"#dc2626",border:`2px solid ${passed?"#86efac":"#fca5a5"}`,borderRadius:100,padding:"6px 24px",fontSize:22,fontWeight:900}}>{pct}%</span>
          <div style={{background:"#f1f5f9",borderRadius:8,height:9,margin:"14px auto 0",maxWidth:360}}>
            <div style={{height:"100%",borderRadius:8,background:passed?"linear-gradient(90deg,#22c55e,#16a34a)":"linear-gradient(90deg,#f43f5e,#dc2626)",width:`${pct}%`,transition:"width 0.6s ease"}}/>
          </div>
          <div style={{display:"flex",justifyContent:"center",gap:14,marginTop:14,flexWrap:"wrap"}}>
            {[{l:"Correct",v:score,c:"#16a34a",bg:"#dcfce7",i:"✅"},{l:"Incorrect",v:qs.length-score,c:"#dc2626",bg:"#fee2e2",i:"❌"},{l:"Pass Mark",v:"80%",c:"#d97706",bg:"#fef3c7",i:"🎯"}].map(s=>(
              <div key={s.l} style={{background:s.bg,borderRadius:10,padding:"9px 16px",minWidth:70,textAlign:"center"}}>
                <div style={{fontSize:18}}>{s.i}</div>
                <div style={{fontSize:18,fontWeight:900,color:s.c}}>{s.v}</div>
                <div style={{fontSize:10,color:"#475569",fontWeight:700}}>{s.l}</div>
              </div>
            ))}
          </div>
        </div>
        <p style={{fontSize:10,letterSpacing:3,color:"#475569",textTransform:"uppercase",fontWeight:800,marginBottom:10}}>Question Review</p>
        <div style={{display:"flex",flexDirection:"column",gap:8,marginBottom:24}}>
          {answers.map((a,i)=>{
            const ok=a.sel===a.q.ans;
            const sv=a.q.sv&&S[a.q.sv];
            return(
              <div key={i} style={{background:"#fff",border:`2px solid ${ok?"#22c55e":"#f43f5e"}`,borderRadius:11,padding:"10px 12px",borderLeft:`5px solid ${ok?"#22c55e":"#f43f5e"}`}}>
                <div style={{display:"flex",justifyContent:"space-between",marginBottom:4}}>
                  <span style={{fontSize:10,color:CC[a.q.cat]||"#334155",fontWeight:700}}>{CI[a.q.cat]||"📚"} {a.q.cat}</span>
                  <span style={{fontSize:14}}>{ok?"✅":"❌"}</span>
                </div>
                <div style={{display:"flex",gap:9,alignItems:"center"}}>
                  {sv&&<div style={{background:"#1e293b",borderRadius:7,padding:"3px",flexShrink:0,width:44,height:44,display:"flex",alignItems:"center",justifyContent:"center",overflow:"hidden"}}>{sv(38)}</div>}
                  <div style={{flex:1,minWidth:0}}>
                    <p style={{margin:"0 0 3px",fontSize:12,color:"#1e293b",fontWeight:600}}>{a.q.q}</p>
                    {!ok&&<p style={{margin:0,fontSize:11,wordBreak:"break-word"}}><span style={{color:"#16a34a",fontWeight:700}}>✓ {a.q.opts[a.q.ans]}</span>{a.sel!==null&&<span style={{color:"#dc2626"}}> — Your answer: {a.q.opts[a.sel]}</span>}</p>}
                  </div>
                </div>
              </div>
            );
          })}
        </div>
        <div style={{display:"flex",gap:10,marginBottom:16}}>
          <button onClick={()=>{try{window.parent.document.getElementById("g1pop").style.display="none";}catch(e){window.top.location.href="https://davidsacademy.ca";}}} style={{flex:1,display:"flex",alignItems:"center",justifyContent:"center",gap:6,background:"#CC0000",color:"#fff",fontSize:13,border:"none",fontWeight:800,padding:"13px",borderRadius:11,boxShadow:"0 4px 16px rgba(204,0,0,0.3)",cursor:"pointer",fontFamily:"inherit"}}>🏠 Home</button>
          <button onClick={()=>startAll()} style={{flex:2,background:"linear-gradient(135deg,#f59e0b,#f97316)",border:"none",borderRadius:11,padding:"13px",fontSize:13,fontWeight:800,color:"#fff",cursor:"pointer",fontFamily:"inherit",boxShadow:"0 4px 16px rgba(245,158,11,0.3)"}}>Try Again 🔄</button>
        </div>
      </div>
    </div>
  );

  return null;
}

const root=ReactDOM.createRoot(document.getElementById('root'));
root.render(<App/>);
</script>
</body>
</html>
