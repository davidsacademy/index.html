{id:"pr23",q:"ਗਿੱਲੀ ਜਾਂ ਬਰਫ਼ ਵਾਲੀ ਸੜਕ ਤੇ ਛੇਤੀ ਰੋਕਣ ਦਾ ਵਧੀਆ ਤਰੀਕਾ ਕੀ ਹੈ?",opts:["ਬਰੇਕ ਛੱਡ ਛੱਡ ਕੇ ਲਾਉਣ ਨਾਲ","ਬਰੇਕ ਤੋਂ ਪੈਰ ਪਰੇ ਰੱਖੋ","ਜ਼ੋਰ ਦੀ ਬਰੇਕ ਲਗਾਓ","ਹਮੇਸ਼ਾ ਦੀ ਤਰ੍ਹਾਂ ਬਰੇਕ ਲਗਾਓ"],ans:0,exp:"ਗਿੱਲੀ ਜਾਂ ਬਰਫ਼ ਵਾਲੀ ਸੜਕ ਤੇ ਬਰੇਕ ਪੈਡਲ ਛੱਡ ਛੱਡ ਕੇ ਲਾਓ।"},
{id:"pr24",q:"ਜੇਕਰ ਤੁਹਾਡੀ ਗੱਡੀ ਸਕਿੱਡ ਹੋਵੇ ਤਾਂ ਕੀ ਕਰਨਾ ਚਾਹੀਦਾ ਹੈ?",opts:["ਸਟੇਅਰਿੰਗ ਸਿੱਧਾ ਕਰੋ","ਜਿਸ ਪਾਸੇ ਗੱਡੀ ਤਿਲਕ ਰਹੀ ਹੈ ਉਸ ਪਾਸੇ ਸਟੇਅਰਿੰਗ ਮੋੜੋ","ਜ਼ੋਰ ਨਾਲ ਬ੍ਰੇਕਾਂ ਲਗਾਓ","ਉਲਟੀ ਦਿਸ਼ਾ ਵਿੱਚ ਸਟੇਅਰਿੰਗ ਮੋੜੋ"],ans:1,exp:"ਸਕਿੱਡ ਹੋਣ ਵੇਲੇ ਉਸ ਦਿਸ਼ਾ ਵਿੱਚ ਸਟੇਅਰਿੰਗ ਮੋੜੋ ਜਿੱਧਰ ਗੱਡੀ ਜਾ ਰਹੀ ਹੈ।"},
{id:"pr25",q:"ਓਂਟੇਰੀਓ ਵਿੱਚ ਗੱਡੀ ਚਲਾਉਂਦੇ ਸਮੇਂ ਹੈਂਡਹੈਲਡ ਸੈੱਲ ਫ਼ੋਨ ਵਰਤਣਾ:",opts:["ਗੈਰਕਾਨੂੰਨੀ ਹੈ","ਛੋਟੀ ਗੱਲਬਾਤ ਲਈ ਕਾਨੂੰਨੀ ਹੈ","ਸਿਰਫ਼ ਹਾਈਵੇ ਤੇ ਗੈਰਕਾਨੂੰਨੀ ਹੈ","ਲਾਲ ਬੱਤੀ ਤੇ ਕਾਨੂੰਨੀ ਹੈ"],ans:0,exp:"ਓਂਟੇਰੀਓ ਵਿੱਚ ਕਿਸੇ ਵੀ ਥਾਂ ਗੱਡੀ ਚਲਾਉਂਦੇ ਸਮੇਂ ਹੈਂਡਹੈਲਡ ਸੈੱਲ ਫ਼ੋਨ ਵਰਤਣਾ ਗੈਰਕਾਨੂੰਨੀ ਹੈ।"},
{id:"pr26",q:"ਧੁੰਦ ਵਿੱਚ ਗੱਡੀ ਚਲਾਓ ਤਾਂ ਕਿਹੜੀਆਂ ਬੱਤੀਆਂ ਵਰਤਣੀਆਂ ਚਾਹੀਦੀਆਂ ਹਨ?",opts:["ਤੇਜ਼ ਬੱਤੀਆਂ","ਮੱਧਮ ਬੱਤੀਆਂ","ਸਿਰਫ਼ ਪਾਰਕਿੰਗ ਬੱਤੀਆਂ","ਕੋਈ ਬੱਤੀਆਂ ਨਹੀਂ"],ans:1,exp:"ਭਾਰੀ ਧੁੰਦ ਵਿੱਚ ਮੱਧਮ ਬੱਤੀਆਂ ਵਰਤੋ — ਤੇਜ਼ ਬੱਤੀਆਂ ਧੁੰਦ ਤੋਂ ਵਾਪਸ ਪਰਤਦੀਆਂ ਹਨ।"},
{id:"pr27",q:"ਢਲਾਣ ਤੇ ਕਿਨਾਰੇ ਨਾਲ ਪਾਰਕ ਕਰਨ ਵੇਲੇ ਪਹੀਏ ਕਿਸ ਦਿਸ਼ਾ ਵਿੱਚ ਮੋੜਨੇ ਚਾਹੀਦੇ ਹਨ?",opts:["ਸੱਜੇ ਮੋੜੋ ਅਤੇ ਪਾਰਕਿੰਗ ਬਰੇਕ ਲਗਾਓ","ਖੱਬੇ ਮੋੜੋ ਅਤੇ ਪਾਰਕਿੰਗ ਬਰੇਕ ਲਗਾਓ","ਸਿੱਧਾ ਰੱਖੋ","ਸਮਾਨਾਂਤਰ ਰਹਿਣ ਦਿਓ"],ans:0,exp:"ਢਲਾਣ ਤੇ ਕਿਨਾਰੇ ਨਾਲ — ਪਹੀਏ ਸੱਜੇ ਮੋੜੋ ਅਤੇ ਪਾਰਕਿੰਗ ਬਰੇਕ ਲਗਾਓ।"},

{id:"pr30",q:"ਪਹਿਲੀ ਵਾਰ ਨਸ਼ੇ ਦੀ ਹਾਲਤ ਵਿੱਚ ਗੱਡੀ ਚਲਾਉਂਦੇ ਫੜੇ ਜਾਣ ਤੇ ਲਾਈਸੈਂਸ ਕਿੰਨੇ ਸਮੇਂ ਲਈ ਮੁਅੱਤਲ ਹੋਵੇਗਾ?",opts:["1 ਮਹੀਨਾ","3 ਮਹੀਨੇ","6 ਮਹੀਨੇ","1 ਸਾਲ"],ans:3,exp:"ਪਹਿਲੀ ਵਾਰ ਸ਼ਰਾਬ ਪੀ ਕੇ ਗੱਡੀ ਚਲਾਉਣ ਦੀ ਸਜ਼ਾ ਇੱਕ ਸਾਲ ਦਾ ਲਾਈਸੈਂਸ ਮੁਅੱਤਲੀ ਹੈ।"},
{id:"pr31",q:"ਚੌਕ ਵਿੱਚ ਟ੍ਰੈਫਿਕ ਸਿਗਨਲ ਕੰਮ ਨਾ ਕਰ ਰਿਹਾ ਹੋਵੇ ਤਾਂ ਕੀ ਕਰਨਾ ਚਾਹੀਦਾ ਹੈ?",opts:["ਰੁੱਕੋ ਅਤੇ ਸਿੱਧੇ ਲੰਘ ਜਾਵੋ","ਹਾਰਨ ਵਜਾ ਕੇ ਲੰਘੋ","ਖੱਬੇ ਸੱਜੇ ਦੇਖੋ","ਚਾਰ-ਪਾਸਿਓਂ ਰੁਕਣ ਵਾਲੇ ਚਿੰਨ੍ਹ ਵਾਂਗੂ ਕਰੋ"],ans:3,exp:"ਜਦੋਂ ਸਿਗਨਲ ਖ਼ਰਾਬ ਹੋਵੇ, ਚੌਕ ਨੂੰ ਚਾਰ-ਪਾਸਿਓਂ ਰੁਕਣ ਵਾਲੇ ਚਿੰਨ੍ਹ ਵਾਂਗੂ ਮੰਨੋ।"},
{id:"pr32",q:"ਓਂਟੇਰੀਓ ਵਿੱਚ ਕੀ ਸੀਟ ਬੈਲਟ ਦਾ ਕਾਨੂੰਨ ਹੈ?",opts:["ਹਾਂ — ਸਾਰਿਆਂ ਨੂੰ ਲਾਉਣੀ ਜ਼ਰੂਰੀ ਹੈ","ਨਹੀਂ","ਸਿਰਫ਼ ਹਾਈਵੇ ਤੇ","ਸਿਰਫ਼ ਸ਼ਹਿਰ ਵਿੱਚ"],ans:0,exp:"ਓਂਟੇਰੀਓ ਦੇ ਕਾਨੂੰਨ ਅਨੁਸਾਰ ਗੱਡੀ ਵਿੱਚ ਸਾਰਿਆਂ ਨੂੰ ਸੀਟ ਬੈਲਟ ਲਾਉਣੀ ਜ਼ਰੂਰੀ ਹੈ।"},
{id:"pr33",q:"ਕਿਸੇ ਦੇ ਜ਼ਖ਼ਮੀ ਹੋਣ ਵਾਲੀ ਦੁਰਘਟਨਾ ਦੀ ਰਿਪੋਰਟ ਕਿਸਨੂੰ ਕਰਨੀ ਚਾਹੀਦੀ ਹੈ?",opts:["48 ਘੰਟਿਆਂ ਦੇ ਵਿੱਚ ਥਾਣੇ ਵਿੱਚ","ਤੁਰੰਤ ਪੁਲਿਸ ਨੂੰ","ਸਿਰਫ਼ ਬੀਮਾ ਕੰਪਨੀ ਨੂੰ","ਸਿਰਫ਼ ਟਰਾਂਸਪੋਰਟ ਮਹਿਕਮੇ ਨੂੰ"],ans:1,exp:"ਕਿਸੇ ਦੇ ਜ਼ਖ਼ਮੀ ਹੋਣ ਵਾਲੀ ਦੁਰਘਟਨਾ ਦੀ ਰਿਪੋਰਟ ਤੁਰੰਤ ਨੇੜੇ ਦੀ ਪੁਲਿਸ ਨੂੰ ਕਰੋ।"},
{id:"pr34",q:"ਕਿਸੇ ਡਰਾਈਵਰ ਨੂੰ ਆਪਣਾ ਪਤਾ ਬਦਲਣ ਤੋਂ ਬਾਅਦ ਕਿੰਨੇ ਸਮੇਂ ਵਿੱਚ ਸੂਚਿਤ ਕਰਨਾ ਜ਼ਰੂਰੀ ਹੈ?",opts:["6 ਦਿਨਾਂ ਦੇ ਅੰਦਰ","15 ਦਿਨਾਂ ਦੇ ਅੰਦਰ","30 ਦਿਨਾਂ ਦੇ ਅੰਦਰ","ਕਦੇ ਵੀ"],ans:0,exp:"ਪਤਾ ਬਦਲਣ ਤੋਂ 6 ਦਿਨਾਂ ਦੇ ਅੰਦਰ ਟਰਾਂਸਪੋਰਟ ਮਨਿਸਟਰੀ ਨੂੰ ਸੂਚਿਤ ਕਰੋ।"},
];

function rnd(arr,n){const s=[...arr].sort(()=>Math.random()-0.5);return s.slice(0,Math.min(n,s.length));}

function App(){
  const [scr,setScr]=useState('home');
  const [qs,setQs]=useState([]);
  const [idx,setIdx]=useState(0);
  const [sel,setSel]=useState(null);
  const [ans,setAns]=useState([]);
  const [sec,setSec]=useState(0);
  const [running,setRunning]=useState(false);

  useEffect(()=>{
    if(!running)return;
    if(sec<=0){finish();return;}
    const t=setTimeout(()=>setSec(s=>s-1),1000);
    return()=>clearTimeout(t);
  },[running,sec]);

  function startQuiz(pool){
    setQs(pool);setIdx(0);setSel(null);setAns([]);
    setSec(pool.length*35);setRunning(true);setScr('quiz');
  }
  function pick(i){if(sel!==null)return;setSel(i);}
  function next(){
    const na=[...ans,{q:qs[idx],sel}];
    if(idx+1>=qs.length){setRunning(false);setAns(na);setScr('results');}
    else{setAns(na);setIdx(i=>i+1);setSel(null);}
  }
  function finish(){setRunning(false);setScr('results');}
  const fmt=s=>`${Math.floor(s/60)}:${String(s%60).padStart(2,'0')}`;
  const P={maxWidth:600,margin:'0 auto',padding:'14px 12px',minHeight:'100vh',fontFamily:"'Noto Sans Gurmukhi',sans-serif"};

  if(scr==='home') return(
    <div style={P}>
      <div style={{background:'#fff',borderRadius:16,padding:'16px',boxShadow:'0 2px 16px rgba(0,0,0,0.1)',marginBottom:12}}>
        <div style={{display:'flex',alignItems:'center',gap:12,marginBottom:12}}>
          
<img src="https://davidsacademy.github.io/Davidsacademy-images/file_0000000055d471f89616cc5ab7787302.png" alt="David's Academy" style={{width:60,height:60,borderRadius:12,objectFit:'cover',flexShrink:0}}/>

            
            <h1 style={{fontSize:20,fontWeight:900,color:'#0f172a',margin:'0 0 2px'}}>G1 ਟੈਸਟ ਤਿਆਰੀ</h1>
            <p style={{fontSize:11,color:'#CC0000',margin:'0 0 2px',fontWeight:700}}>David's Academy of Defensive Driving</p>
            <p style={{fontSize:10,color:'#64748b',margin:0}}>📞 647-657-7913 | info@davidsacademy.ca</p>
          </div>
        </div>
        <div style={{background:'#fff7ed',border:'1px solid #fed7aa',borderRadius:10,padding:'10px',fontSize:12,color:'#9a3412',marginBottom:14,lineHeight:1.6}}>
          ⚠️ <strong>ਨੋਟਿਸ:</strong> ਇਹ ਅਭਿਆਸ ਟੈਸਟ ਸਿੱਖਿਆ ਦੇ ਉਦੇਸ਼ਾਂ ਲਈ ਹੈ। ਕੋਈ ਗਲਤੀ ਮਿਲੇ ਤਾਂ ਈਮੇਲ ਕਰੋ।
        </div>
        <button onClick={()=>startQuiz([...rnd(ALL_SIGNS,20),...rnd(ALL_RULES,20)].sort(()=>Math.random()-0.5))}
          style={{width:'100%',padding:'14px',background:'linear-gradient(135deg,#2563eb,#0ea5e9)',color:'#fff',border:'none',borderRadius:12,fontSize:16,fontWeight:800,cursor:'pointer',marginBottom:10,fontFamily:'inherit'}}>
          🎯 ਅਭਿਆਸ ਟੈਸਟ (ਸਾਰੇ) — 40 ਸਵਾਲ
        </button>
        <div style={{display:'grid',gridTemplateColumns:'1fr 1fr',gap:8,marginBottom:6}}>
          <button onClick={()=>startQuiz([...ALL_SIGNS].sort(()=>Math.random()-0.5).slice(0,18))}
            style={{padding:'12px 8px',background:'#f59e0b',color:'#fff',border:'none',borderRadius:10,fontSize:13,fontWeight:700,cursor:'pointer',fontFamily:'inherit'}}>
            🚦 ਚਿੰਨ੍ਹ 1–18
          </button>
          <button onClick={()=>startQuiz([...ALL_SIGNS].sort(()=>Math.random()-0.5).slice(0,16))}
            style={{padding:'12px 8px',background:'#d97706',color:'#fff',border:'none',borderRadius:10,fontSize:13,fontWeight:700,cursor:'pointer',fontFamily:'inherit'}}>
            🚦 ਚਿੰਨ੍ਹ 19–34
          </button>
          <button onClick={()=>startQuiz([...ALL_RULES].sort(()=>Math.random()-0.5).slice(0,17))}
            style={{padding:'12px 8px',background:'#059669',color:'#fff',border:'none',borderRadius:10,fontSize:13,fontWeight:700,cursor:'pointer',fontFamily:'inherit'}}>
            📋 ਨਿਯਮ 1–17
          </button>
          <button onClick={()=>startQuiz([...ALL_RULES].sort(()=>Math.random()-0.5).slice(0,17))}
            style={{padding:'12px 8px',background:'#047857',color:'#fff',border:'none',borderRadius:10,fontSize:13,fontWeight:700,cursor:'pointer',fontFamily:'inherit'}}>
            📋 ਨਿਯਮ 18–34
          </button>
        </div>
        <div style={{background:'#fffbeb',border:'1px solid #fde68a',borderRadius:8,padding:'8px 10px',fontSize:11,color:'#78350f'}}>
          💡 <strong>ਅਸਲ G1 ਟੈਸਟ:</strong> 40 ਸਵਾਲ — 20 ਚਿੰਨ੍ਹ + 20 ਨਿਯਮ। ਪਾਸ = <strong>80%</strong>
        </div>
      </div>
    </div>
  );

  if(scr==='quiz'&&qs.length>0){
    const q=qs[idx];
    const sv=q.sv&&S[q.sv];
    return(
      <div style={P}>
        <div style={{background:'#fff',borderRadius:16,padding:'14px',boxShadow:'0 2px 16px rgba(0,0,0,0.1)'}}>
          <div style={{display:'flex',justifyContent:'space-between',alignItems:'center',marginBottom:8}}>
            <button onClick={()=>{setRunning(false);setScr('home');}} style={{background:'#f1f5f9',border:'none',borderRadius:8,padding:'6px 12px',cursor:'pointer',fontSize:13,fontWeight:700}}>← ਛੱਡੋ</button>
            <span style={{fontSize:12,color:'#64748b',fontWeight:700}}>{idx+1}/{qs.length}</span>
            <div style={{background:sec<30?'#fee2e2':'#dcfce7',borderRadius:20,padding:'4px 12px',fontSize:13,fontWeight:800,color:sec<30?'#dc2626':'#16a34a',fontFamily:'monospace'}}>⏱{fmt(sec)}</div>
          </div>
          <div style={{background:'#e2e8f0',borderRadius:99,height:6,marginBottom:14}}>
            <div style={{height:6,borderRadius:99,background:'linear-gradient(90deg,#f59e0b,#f97316)',width:`${((idx+1)/qs.length)*100}%`,transition:'width .3s'}}/>
          </div>
          {sv&&<div style={{display:'flex',justifyContent:'center',marginBottom:12}}>{sv(80)}</div>}
          <p style={{fontSize:15,fontWeight:700,lineHeight:1.7,marginBottom:14,color:'#1e293b'}}>{q.q}</p>
          <div style={{display:'flex',flexDirection:'column',gap:8}}>
            {q.opts.map((opt,i)=>{
              let bg='#fff',border='1.5px solid #e2e8f0',color='#1e293b';
              if(sel!==null){
                if(i===q.ans){bg='#f0fdf4';border='2px solid #22c55e';color='#14532d';}
                else if(i===sel){bg='#fff1f2';border='2px solid #f43f5e';color='#881337';}
              }
              return <button key={i} onClick={()=>pick(i)} disabled={sel!==null}
                style={{background:bg,border,color,borderRadius:10,padding:'12px 14px',cursor:sel!==null?'default':'pointer',textAlign:'left',fontSize:13,fontFamily:'inherit',fontWeight:600,lineHeight:1.5}}>
                <span style={{display:'inline-block',width:22,height:22,borderRadius:'50%',background:sel!==null&&i===q.ans?'#22c55e':sel!==null&&i===sel?'#f43f5e':'#e2e8f0',color:sel!==null&&(i===q.ans||i===sel)?'#fff':'#475569',textAlign:'center',lineHeight:'22px',fontSize:11,fontWeight:800,marginRight:8,flexShrink:0,verticalAlign:'middle'}}>
                  {sel!==null&&i===q.ans?'✓':sel!==null&&i===sel?'✗':String.fromCharCode(65+i)}
                </span>{opt}
              </button>;
            })}
          </div>
          {sel!==null&&<>
            <div style={{background:sel===q.ans?'#f0fdf4':'#fff1f2',border:`1.5px solid ${sel===q.ans?'#86efac':'#fda4af'}`,borderRadius:10,marginTop:10,padding:'10px 12px',fontSize:12,lineHeight:1.7,color:sel===q.ans?'#14532d':'#881337'}}>
              {sel===q.ans?'✅ ਸਹੀ! ':'❌ ਗਲਤ। '}<span style={{color:'#1e293b'}}>{q.exp}</span>
            </div>
            <button onClick={next} style={{marginTop:12,width:'100%',background:'linear-gradient(135deg,#f59e0b,#f97316)',border:'none',borderRadius:11,padding:'14px',fontSize:14,fontWeight:800,color:'#fff',cursor:'pointer',fontFamily:'inherit'}}>
              {idx+1>=qs.length?'ਨਤੀਜੇ ਦੇਖੋ →':'ਅਗਲਾ ਸਵਾਲ →'}
            </button>
          </>}
        </div>
      </div>
    );
  }

  if(scr==='results'){
    const score=ans.filter(a=>a.sel===a.q.ans).length;
    const total=qs.length;
    const pct=total>0?Math.round((score/total)*100):0;
    const pass=pct>=80;
    return(
      <div style={P}>
        <div style={{background:'#fff',borderRadius:16,padding:'20px',boxShadow:'0 2px 16px rgba(0,0,0,0.1)'}}>
          <div style={{textAlign:'center',marginBottom:20}}>
            <div style={{fontSize:48,marginBottom:8}}>{pass?'🏆':'📚'}</div>
            <h2 style={{fontSize:26,fontWeight:900,color:pass?'#16a34a':'#dc2626',margin:'0 0 4px'}}>{pass?'ਪਾਸ! 🎉':'ਹੋਰ ਅਭਿਆਸ ਕਰੋ'}</h2>
            <div style={{fontSize:36,fontWeight:900,color:'#1e293b'}}>{score}/{total}</div>
            <div style={{display:'inline-block',background:pass?'#dcfce7':'#fee2e2',color:pass?'#16a34a':'#dc2626',borderRadius:100,padding:'6px 20px',fontSize:20,fontWeight:900,marginTop:6}}>{pct}%</div>
            <div style={{background:'#e2e8f0',borderRadius:99,height:8,margin:'12px 0 4px'}}>
              <div style={{height:8,borderRadius:99,background:pass?'#22c55e':'#f43f5e',width:pct+'%',transition:'width .6s'}}/>
            </div>
            <p style={{fontSize:12,color:'#64748b',margin:0}}>{pass?'ਵਧਾਈ ਹੋਵੇ! G1 ਪਾਸ ਕਰਨ ਲਈ 80% ਚਾਹੀਦਾ ਹੈ।':'ਜਵਾਬਾਂ ਦੀ ਸਮੀਖਿਆ ਕਰੋ ਅਤੇ ਦੁਬਾਰਾ ਕੋਸ਼ਿਸ਼ ਕਰੋ।'}</p>
          </div>
          <div style={{display:'flex',gap:10,marginBottom:16}}>
            <button onClick={()=>setScr('home')} style={{flex:1,background:'#1e293b',color:'#fff',border:'none',borderRadius:10,padding:'12px',fontSize:13,fontWeight:800,cursor:'pointer',fontFamily:'inherit'}}>🏠 ਮੁੱਖ ਪੰਨਾ</button>
            <button onClick={()=>{setIdx(0);setSel(null);setAns([]);setSec(qs.length*35);setRunning(true);setScr('quiz');}}
              style={{flex:2,background:'linear-gradient(135deg,#f59e0b,#f97316)',border:'none',borderRadius:10,padding:'12px',fontSize:13,fontWeight:800,color:'#fff',cursor:'pointer',fontFamily:'inherit'}}>ਦੁਬਾਰਾ ਕੋਸ਼ਿਸ਼ ਕਰੋ 🔄</button>
          </div>
          <p style={{fontSize:11,fontWeight:800,color:'#475569',letterSpacing:1,textTransform:'uppercase',marginBottom:8}}>ਸਵਾਲਾਂ ਦੀ ਸਮੀਖਿਆ</p>
          {ans.map((a,i)=>{
            const ok=a.sel===a.q.ans;
            const sv=a.q.sv&&S[a.q.sv];
            return <div key={i} style={{background:ok?'#f0fdf4':'#fff1f2',border:`1.5px solid ${ok?'#bbf7d0':'#fecaca'}`,borderLeft:`4px solid ${ok?'#22c55e':'#f43f5e'}`,borderRadius:10,padding:'10px 12px',marginBottom:8}}>
              <div style={{display:'flex',gap:10,alignItems:'center'}}>
                {sv&&<div style={{flexShrink:0}}>{sv(40)}</div>}
                <div style={{flex:1}}>
                  <p style={{margin:'0 0 4px',fontSize:12,fontWeight:700,color:'#1e293b'}}>{ok?'✅':'❌'} {a.q.q}</p>
                  <p style={{margin:0,fontSize:11,color:'#16a34a',fontWeight:600}}>✓ {a.q.opts[a.q.ans]}</p>
                  {!ok&&a.sel!==null&&<p style={{margin:0,fontSize:11,color:'#dc2626'}}>✗ {a.q.opts[a.sel]}</p>}
                </div>
              </div>
            </div>;
          })}
        </div>
      </div>
    );
  }
  return null;
}

ReactDOM.createRoot(document.getElementById('root')).render(<App/>);
</script>
</body>
</html>
