  {id:"pr25",cat:"ਸੜਕ ਦੇ ਨਿਯਮ",sv:null,q:"ਜਦੋਂ ਬੱਸ ਤੋਂ ਮੁਸਾਫ਼ਰ ਚੜ੍ਹਦੇ ਉਤਰਦੇ ਹੋਣ (ਸੁਰੱਖਿਆ ਜਗ੍ਹਾ ਨਾ ਹੋਵੇ), ਅੱਗੇ ਨਿਕਲਣ ਤੋਂ ਪਹਿਲਾਂ ਕੀ ਕਰਨਾ ਚਾਹੀਦਾ ਹੈ?",opts:["ਬੱਸ ਦੇ ਪਿੱਛੇ ਰੁਕੋ ਅਤੇ ਬਾਅਦ ਵਿੱਚ ਜਾਓ","ਹਾਰਨ ਵਜਾ ਕੇ ਸੁਰੱਖਿਆ ਨਾਲ ਅੱਗੇ ਵੱਧੋ","ਖੱਬੇ ਪਾਸੇ ਦਾ ਰਸਤਾ ਖਾਲੀ ਹੋਵੇ ਤਾਂ ਅੱਗੇ ਚਲੇ ਜਾਓ","ਜਿਸ ਪਾਸਿਓਂ ਮੁਸਾਫ਼ਰ ਚੜ੍ਹਦੇ ਉਤਰਦੇ ਹਨ ਉਸ ਪਾਸੇ ਵੱਲ 2 ਮੀਟਰ ਪਿੱਛੇ ਖੜੋ ਅਤੇ ਸੁਰੱਖਿਅਤ ਹੋਣ ਤੇ ਅੱਗੇ ਵੱਧੋ"],ans:3,exp:"ਬੱਸ ਦੇ ਪਿੱਛੇ ਘੱਟੋ-ਘੱਟ 2 ਮੀਟਰ ਰੁਕੋ ਅਤੇ ਸੁਰੱਖਿਅਤ ਹੋਣ ਤੇ ਹੀ ਅੱਗੇ ਵਧੋ।"},
  {id:"pr26",cat:"ਸੜਕ ਦੇ ਨਿਯਮ",sv:null,q:"ਓਂਟੇਰੀਓ ਦੇ ਸੂਬਾਈ ਹਾਈਵੇ ਤੇ ਵੱਧ ਤੋਂ ਵੱਧ ਰਫ਼ਤਾਰ ਕਿੰਨੀ ਹੋਣੀ ਚਾਹੀਦੀ ਹੈ (ਜੇ ਹੋਰ ਚਿੰਨ੍ਹ ਨਾ ਹੋਵੇ)?",opts:["80 ਕਿਲੋਮੀਟਰ/ਘੰਟਾ","90 ਕਿਲੋਮੀਟਰ/ਘੰਟਾ","100 ਕਿਲੋਮੀਟਰ/ਘੰਟਾ","110 ਕਿਲੋਮੀਟਰ/ਘੰਟਾ"],ans:2,exp:"ਓਂਟੇਰੀਓ ਹਾਈਵੇ ਤੇ ਡਿਫਾਲਟ ਵੱਧ ਤੋਂ ਵੱਧ ਰਫ਼ਤਾਰ 100 ਕਿਲੋਮੀਟਰ/ਘੰਟਾ ਹੈ।"},

  {id:"pr28",cat:"ਸੜਕ ਦੇ ਨਿਯਮ",sv:null,q:"ਗਿੱਲੀ ਜਾਂ ਬਰਫ਼ ਵਾਲੀ ਸੜਕ ਤੇ ਛੇਤੀ ਤੋਂ ਛੇਤੀ ਰੋਕਣ ਦਾ ਵਧੀਆ ਤਰੀਕਾ ਕੀ ਹੈ?",opts:["ਬਰੇਕ ਛੱਡ ਛੱਡ ਕੇ ਲਾਉਣ ਨਾਲ ਜਦੋਂ ਤੱਕ ਗੱਡੀ ਨਾ ਰੁਕ ਜਾਵੇ","ਬਰੇਕ ਤੋਂ ਪੈਰ ਪਰੇ ਰੱਖੋ ਅਤੇ ਆਪਣੇ ਆਪ ਗੱਡੀ ਰੁਕਣ ਦਿਓ","ਜ਼ੋਰ ਦੀ ਬਰੇਕ ਲਗਾਓ ਅਤੇ ਗੱਡੀ ਨੂੰ ਤਿਲਕਣ ਤੋਂ ਬਚਾਉਣ ਦੀ ਕੋਸ਼ਿਸ਼ ਕਰੋ","ਹਮੇਸ਼ਾ ਦੀ ਤਰ੍ਹਾਂ ਬਰੇਕ ਲਗਾਓ"],ans:0,exp:"ਗਿੱਲੀ ਜਾਂ ਬਰਫ਼ ਵਾਲੀ ਸੜਕ ਤੇ ਬਰੇਕ ਪੈਡਲ ਛੱਡ ਛੱਡ ਕੇ ਲਾਓ।"},
  {id:"pr29",cat:"ਸੜਕ ਦੇ ਨਿਯਮ",sv:null,q:"ਹਾਈਵੇ ਵਿੱਚ ਦਾਖ਼ਲ ਹੋਣ ਵੇਲੇ ਕੀ ਕਰਨਾ ਚਾਹੀਦਾ ਹੈ?",opts:["ਰਫ਼ਤਾਰ ਵਧਾਉਣ ਵਾਲੀ ਲੇਨ ਵਿੱਚ ਖੜੋ ਅਤੇ ਰਸਤਾ ਮਿਲਣ ਦੀ ਉਡੀਕ ਕਰੋ","ਜਲਦੀ ਨਾਲ ਹਾਈਵੇ ਦੀ ਰਫ਼ਤਾਰ ਤੱਕ ਗੱਡੀ ਦੀ ਸਪੀਡ ਬਣਾਓ ਅਤੇ ਫਿਰ ਟ੍ਰੈਫਿਕ ਵਿੱਚ ਵੜ੍ਹ ਜਾਓ","ਹੌਲੀ ਹੋਵੋ ਅਤੇ ਇਕਦਮ ਹਾਈਵੇ ਤੇ ਚੜ੍ਹ ਜਾਵੋ","ਗੱਡੀ ਹੌਲੀ ਚਲਾਓ ਅਤੇ ਰੁਕਣ ਲਈ ਤਿਆਰ ਰਹੋ"],ans:1,exp:"ਰੈਂਪ ਤੇ ਹਾਈਵੇ ਦੀ ਰਫ਼ਤਾਰ ਤੱਕ ਤੇਜ਼ ਕਰੋ, ਫਿਰ ਸੁਚੱਜੇ ਢੰਗ ਨਾਲ ਟ੍ਰੈਫਿਕ ਵਿੱਚ ਰਲ ਜਾਓ।"},
  {id:"pr30",cat:"ਸੜਕ ਦੇ ਨਿਯਮ",sv:null,q:"ਜੇ ਤੁਸੀਂ ਐਕਸਪ੍ਰੈੱਸਵੇ ਦਾ ਐਗਜ਼ਿਟ ਖੁੰਝ ਜਾਓ ਤਾਂ ਕੀ ਕਰਨਾ ਚਾਹੀਦਾ ਹੈ?",opts:["ਮੋਢੇ ਤੇ ਰੁਕੋ ਅਤੇ ਨਕਸ਼ਾ ਦੇਖੋ","ਜੇ ਕੋਈ ਗੱਡੀ ਨਹੀਂ ਤਾਂ ਪਿੱਛੇ ਹੱਟੋ","ਸਿੱਧੇ ਜਾਓ ਅਤੇ ਅਗਲੇ ਐਗਜ਼ਿਟ ਤੇ ਨਿਕਲੋ","ਯੂ-ਟਰਨ ਮਾਰੋ"],ans:2,exp:"ਕਦੇ ਐਕਸਪ੍ਰੈੱਸਵੇ ਤੇ ਨਾ ਰੁਕੋ ਜਾਂ ਪਿੱਛੇ ਨਾ ਹੱਟੋ। ਅਗਲੇ ਐਗਜ਼ਿਟ ਤੇ ਜਾਓ।"},
  {id:"pr31",cat:"ਸੜਕ ਦੇ ਨਿਯਮ",sv:null,q:"ਓਂਟੇਰੀਓ ਵਿੱਚ ਕੀ ਸੀਟ ਬੈਲਟ ਦਾ ਕਾਨੂੰਨ ਹੈ?",opts:["ਹਾਂ — ਸਾਰਿਆਂ ਨੂੰ ਸੀਟ ਬੈਲਟ ਲਾਉਣੀ ਜ਼ਰੂਰੀ ਹੈ","ਨਹੀਂ","ਸਿਰਫ਼ ਖੁੱਲੇ ਹਾਈਵੇ ਤੇ","ਸਿਰਫ਼ ਸ਼ਹਿਰ ਵਿੱਚ"],ans:0,exp:"ਓਂਟੇਰੀਓ ਦੇ ਕਾਨੂੰਨ ਅਨੁਸਾਰ ਗੱਡੀ ਵਿੱਚ ਸਾਰਿਆਂ ਨੂੰ ਸੀਟ ਬੈਲਟ ਲਾਉਣੀ ਜ਼ਰੂਰੀ ਹੈ।"},
  {id:"pr32",cat:"ਸੜਕ ਦੇ ਨਿਯਮ",sv:null,q:"ਜਦੋਂ ਰਾਤ ਵੇਲੇ ਹਾਈਵੇ ਤੇ ਕਾਰ ਚਲਾਉਂਦੇ ਹੋ ਤਾਂ ਮੱਧਮ ਲਾਈਟਾਂ ਜਗਾਉਣੀਆਂ ਹਨ। ਜਦੋਂ:",opts:["ਤੁਹਾਡੇ ਸਾਹਮਣੇ ਤੋਂ ਗੱਡੀ ਆ ਰਹੀ ਹੋਵੇ ਜਾਂ ਤੁਸੀਂ ਗੱਡੀ ਦੇ ਪਿੱਛੇ ਜਾਂਦੇ ਹੋ","ਜਾਂ ਫਿਰ ਸਾਹਮਣੇ ਆ ਰਹੀ ਗੱਡੀ ਦੀਆਂ ਲਾਈਟਾਂ ਕਾਰਨ ਘੱਟ ਦਿਸਦਾ ਹੋਵੇ","ਜਾਂ ਫਿਰ ਕਿਸੇ ਚੌਰਸੇ ਨੇੜੇ ਜਾ ਰਹੇ ਹੋਵੋ","ਜਾਂ ਫਿਰ ਜਦੋਂ ਦੂਸਰਾ ਡਰਾਈਵਰ ਆਪਣੀਆਂ ਲਾਈਟਾਂ ਮੱਧਮ ਕਰ ਲਵੇ"],ans:0,exp:"ਜਦੋਂ ਕੋਈ ਗੱਡੀ ਸਾਹਮਣੇ ਤੋਂ ਆਵੇ ਜਾਂ ਤੁਸੀਂ ਕਿਸੇ ਗੱਡੀ ਦੇ ਪਿੱਛੇ ਜਾ ਰਹੇ ਹੋਵੋ ਤਾਂ ਮੱਧਮ ਲਾਈਟਾਂ ਵਰਤੋ।"},
  {id:"pr33",cat:"ਸੜਕ ਦੇ ਨਿਯਮ",sv:null,q:"ਕਿਸੇ ਵੀ ਦੁਰਘਟਨਾ ਜਿਸ ਵਿੱਚ ਕੋਈ ਜ਼ਖ਼ਮੀ ਹੋਵੇ ਤਾਂ ਕੀ ਕਰਨਾ ਚਾਹੀਦਾ ਹੈ?",opts:["ਨੇੜੇ ਦੇ ਥਾਣੇ ਵਿੱਚ ਜਲਦੀ ਤੋਂ ਜਲਦੀ ਰਿਪੋਰਟ ਲਿਖਵਾਓ","48 ਘੰਟਿਆਂ ਦੇ ਵਿੱਚ ਰਿਪੋਰਟ ਲਿਖਵਾਓ","ਸਿਰਫ਼ ਆਪਣੀ ਬੀਮਾ ਕੰਪਨੀ ਨੂੰ ਰਿਪੋਰਟ ਕਰਵਾਓ","ਸਿਰਫ਼ ਟਰਾਂਸਪੋਰਟ ਮਹਿਕਮੇ ਨੂੰ ਰਿਪੋਰਟ ਕਰੋ"],ans:0,exp:"ਕਿਸੇ ਦੇ ਜ਼ਖ਼ਮੀ ਹੋਣ ਵਾਲੀ ਦੁਰਘਟਨਾ ਦੀ ਰਿਪੋਰਟ ਤੁਰੰਤ ਨੇੜੇ ਦੀ ਪੁਲਿਸ ਨੂੰ ਕਰੋ।"},

// ========== QUESTION SETS ==========
const SETS = [
  {label:"ਟ੍ਰੈਫਿਕ ਚਿੰਨ੍ਹ 1–18",  key:"s1", pool:ALL_SIGNS.slice(0,18)},
  {label:"ਟ੍ਰੈਫਿਕ ਚਿੰਨ੍ਹ 19–34", key:"s2", pool:ALL_SIGNS.slice(18)},
  {label:"ਸੜਕ ਦੇ ਨਿਯਮ 1–20",    key:"r1", pool:ALL_RULES.slice(0,20)},
  {label:"ਸੜਕ ਦੇ ਨਿਯਮ 21–38",   key:"r2", pool:ALL_RULES.slice(20)},
];

function shuffle(arr){ return [...arr].sort(()=>Math.random()-0.5); }

function pick(pool, n){
  const s = shuffle(pool);
  return s.slice(0, Math.min(n, s.length));
}

// ========== TIMER HOOK ==========
function useTimer(active, onExpire){
  const [sec, setSec] = React.useState(600);
  React.useEffect(()=>{
    if(!active){ setSec(600); return; }
    if(sec<=0){ onExpire(); return; }
    const t = setTimeout(()=>setSec(s=>s-1),1000);
    return ()=>clearTimeout(t);
  },[active,sec]);
  return sec;
}

// ========== SIGN DISPLAY ==========
function SignDisplay({sv}){
  if(!sv||!S[sv]) return null;
  return <div style={{display:'flex',justifyContent:'center',margin:'12px 0'}}>
    {S[sv](90)}
  </div>;
}

// ========== QUIZ SCREEN ==========
function Quiz({questions, onDone, onBack}){
  const [idx, setIdx] = React.useState(0);
  const [chosen, setChosen] = React.useState(null);
  const [answers, setAnswers] = React.useState([]);
  const [done, setDone] = React.useState(false);
  const total = questions.length;
  const q = questions[idx];
  const sec = useTimer(!done, ()=>{});
  const mm = String(Math.floor(sec/60)).padStart(2,'0');
  const ss = String(sec%60).padStart(2,'0');

  function choose(i){
    if(chosen!==null) return;
    setChosen(i);
    setAnswers(a=>[...a,{q, chosen:i, correct: i===q.ans}]);
  }
  function next(){
    if(idx+1>=total){ setDone(true); return; }
    setIdx(i=>i+1);
    setChosen(null);
  }

  if(done) return <Results questions={questions} answers={answers} onBack={onBack}/>;

  return <div style={C.page}>
    <div style={C.card}>
      <div style={{display:'flex',justifyContent:'space-between',alignItems:'center',marginBottom:6}}>
        <button onClick={onBack} style={{background:'none',border:'none',cursor:'pointer',fontSize:22,color:'#64748b'}}>←</button>
        <span style={sec<60?C.timerWarn:C.timerOk}>⏱ {mm}:{ss}</span>
        <span style={{fontSize:13,color:'#64748b'}}>{idx+1}/{total}</span>
      </div>
      <div style={C.prog}><div style={C.progFill(((idx+1)/total)*100)}/></div>
      <div style={C.catBadge(q.cat)}>{q.cat}</div>
      <SignDisplay sv={q.sv}/>
      <div style={C.qText}>{q.q}</div>
      {q.opts.map((opt,i)=>{
        let st = null;
        if(chosen!==null){
          if(i===q.ans) st='correct';
          else if(i===chosen) st='wrong';
        }
        return <button key={i} style={C.optBtn(st)} onClick={()=>choose(i)}>{opt}</button>;
      })}
      {chosen!==null && <>
        <div style={C.exp}>💡 {q.exp}</div>
        <button style={{...C.mainBtn,background:'#2563eb',color:'white',marginTop:12}} onClick={next}>
          {idx+1>=total?'ਨਤੀਜੇ ਵੇਖੋ':'ਅਗਲਾ ਸਵਾਲ →'}
        </button>
      </>}
    </div>
  </div>;
}

// ========== RESULTS SCREEN ==========
function Results({questions, answers, onBack}){
  const [showReview, setShowReview] = React.useState(false);
  const score = answers.filter(a=>a.correct).length;
  const total = questions.length;
  const pct = Math.round((score/total)*100);
  const pass = pct>=80;

  return <div style={C.page}>
    <div style={C.card}>
      <div style={pass?C.passBox:C.failBox}>
        <div style={{fontSize:48}}>{pass?'🏆':'📚'}</div>
        <div style={{fontSize:26,fontWeight:900,color:pass?'#166534':'#dc2626',margin:'6px 0'}}>
          {pass?'ਪਾਸ!':'ਫੇਲ੍ਹ'}
        </div>
        <div style={{fontSize:32,fontWeight:900,color:'#1e293b'}}>{score}/{total}</div>
        <div style={{fontSize:18,color:'#64748b'}}>{pct}%</div>
        <div style={{fontSize:13,color:'#64748b',marginTop:4}}>
          {pass?'ਬਹੁਤ ਵਧੀਆ! G1 ਪਾਸ ਕਰਨ ਲਈ 80% ਚਾਹੀਦਾ ਹੈ।':'ਅਭਿਆਸ ਕਰਦੇ ਰਹੋ। ਪਾਸ ਹੋਣ ਲਈ 80% ਚਾਹੀਦਾ ਹੈ।'}
        </div>
      </div>
      <button style={{...C.mainBtn,background:'#2563eb',color:'white'}} onClick={onBack}>🏠 ਮੁੱਖ ਪੰਨੇ ਤੇ ਜਾਓ</button>
      <button style={{...C.secBtn,background:'#f8fafc',color:'#1e293b',border:'1.5px solid #e2e8f0'}}
        onClick={()=>setShowReview(r=>!r)}>
        {showReview?'ਸਮੀਖਿਆ ਬੰਦ ਕਰੋ ▲':'ਸਵਾਲਾਂ ਦੀ ਸਮੀਖਿਆ ▼'}
      </button>
      {showReview && answers.map((a,i)=><div key={i} style={C.reviewItem(a.correct)}>
        <div style={{fontSize:12,fontWeight:700,color:a.correct?'#16a34a':'#dc2626',marginBottom:4}}>
          {a.correct?'✅ ਸਹੀ':'❌ ਗਲਤ'} · ਸ. {i+1}
        </div>
        <SignDisplay sv={a.q.sv}/>
        <div style={{fontSize:13,fontWeight:600,color:'#1e293b',marginBottom:4}}>{a.q.q}</div>
        <div style={{fontSize:12,color:'#16a34a',marginBottom:2}}>✓ {a.q.opts[a.q.ans]}</div>
        {!a.correct&&<div style={{fontSize:12,color:'#dc2626',marginBottom:2}}>✗ {a.q.opts[a.chosen]}</div>}
        <div style={{fontSize:12,color:'#0c4a6e',marginTop:4}}>💡 {a.q.exp}</div>
      </div>)}
    </div>
  </div>;
}

// ========== APP ==========
function App(){
  const [mode, setMode] = React.useState(null);
  const [questions, setQuestions] = React.useState([]);

  function start(key){
    let pool;
    if(key==='all'){
      pool = [...pick(ALL_SIGNS,20), ...pick(ALL_RULES,20)];
      pool = shuffle(pool);
    } else {
      const set = SETS.find(s=>s.key===key);
      pool = shuffle(set.pool);
    }
    setQuestions(pool);
    setMode(key);
  }

  if(!mode) return <Landing onStart={start}/>;
  return <Quiz questions={questions} onDone={()=>setMode(null)} onBack={()=>setMode(null)}/>;
}

ReactDOM.createRoot(document.getElementById('root')).render(<App/>);
</script>
